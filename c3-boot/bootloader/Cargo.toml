[package]
name = "c3-bootloader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "c3-bootloader"
test = false
bench = false

[dependencies]
c3-crypto = { path = "../crypto" }
c3-verify = { path = "../verify" }

[lints.rust]
unused = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
