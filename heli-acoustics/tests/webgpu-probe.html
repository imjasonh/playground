<!doctype html>
<meta charset="utf-8" />
<title>webgpu acoustics probe</title>
<pre id="out">running</pre>
<script type="module">
  import { GpuAcoustics } from '/src/acousticsGpu.js';
  import { BUILDINGS, helicopterPath } from '/src/city.js';
  import { computeReflections } from '/src/reflections.js';
  import { occlusionAmount } from '/src/occlusion.js';

  let verdict;
  try {
    const gpu = new GpuAcoustics({ buildings: BUILDINGS, limit: 12 });
    await gpu.init();
    const listener = [0, 1.7, 0];
    const source = helicopterPath(0);
    const result = await gpu.compute(listener, source);
    const cpuOcc = occlusionAmount(listener, source, BUILDINGS);
    const cpuRefs = computeReflections(listener, source, BUILDINGS, { limit: 12, maxOrder: 2 });
    const occMatch = result.occlusion === cpuOcc;
    const hasRefs = result.reflections.length >= 1 || cpuRefs.length >= 1;
    verdict = {
      pass: result.backend === 'webgpu' && occMatch && hasRefs,
      backend: result.backend,
      preferredWebGpu: result.backend === 'webgpu',
      occMatch,
      gpuOcclusion: result.occlusion,
      cpuOcclusion: cpuOcc,
      gpuTaps: result.reflections.length,
      cpuTaps: cpuRefs.length,
      gpuOrder2: result.reflections.filter((r) => r.order === 2).length,
      hasNavigatorGpu: !!navigator.gpu,
    };
  } catch (err) {
    verdict = {
      pass: false,
      backend: 'unavailable',
      preferredWebGpu: false,
      reason: String(err?.message || err),
      hasNavigatorGpu: !!navigator.gpu,
    };
  }
  document.getElementById('out').textContent = ['WEBGPU_PROBE', JSON.stringify(verdict)].join('=');
</script>
