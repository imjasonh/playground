<!doctype html>
<meta charset="utf-8" />
<title>live ear probe</title>
<pre id="out">running</pre>
<script type="module">
  import { HeliAudio } from '/src/audio.js';
  import { proveHrtfBinaural } from '/src/hrtfProof.js';
  import {
    orbitPosition,
    forwardVector,
    upVector,
    relativeAzimuthDeg,
  } from '/src/geometry.js';

  const ORBIT = { radius: 40, height: 18, angularSpeed: (2 * Math.PI) / 9, phase: 0 };
  const audio = new HeliAudio();
  await audio.resume();
  audio.fadeIn();
  audio.setReflectionsEnabled(false);
  audio.setOcclusionEnabled(false);

  const proof = await proveHrtfBinaural();

  const samples = [];
  const start = performance.now();
  await new Promise((resolve) => {
    function tick() {
      const t = (performance.now() - start) / 1000;
      const pos = orbitPosition(ORBIT, t);
      audio.update(pos, [0, 0, 0], forwardVector(0), upVector(), {
        occlusion: 0,
        reflections: [],
      });
      const levels = audio.earLevels();
      const az = relativeAzimuthDeg(pos, [0, 0, 0], 0);
      if (levels.left + levels.right > 0.0005) {
        samples.push({
          t,
          az,
          balance: levels.balance,
          left: levels.left,
          right: levels.right,
        });
      }
      if (t < 10.5) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });

  const rightish = samples.filter((s) => s.az > 60 && s.az < 120);
  const leftish = samples.filter((s) => s.az < -60 && s.az > -120);
  const avg = (arr, key) => arr.reduce((a, s) => a + s[key], 0) / Math.max(arr.length, 1);
  const rightBal = avg(rightish, 'balance');
  const leftBal = avg(leftish, 'balance');
  const livePass =
    rightish.length >= 5 && leftish.length >= 5 && rightBal > 0.05 && leftBal < -0.05;

  const verdict = {
    pass: proof.pass && livePass,
    proof,
    live: {
      pass: livePass,
      sampleCount: samples.length,
      rightishCount: rightish.length,
      leftishCount: leftish.length,
      avgBalanceWhenRight: rightBal,
      avgBalanceWhenLeft: leftBal,
      contextState: audio.earLevels().contextState,
    },
  };
  document.getElementById('out').textContent = ['LIVE_EAR', JSON.stringify(verdict)].join(
    '=',
  );
</script>
