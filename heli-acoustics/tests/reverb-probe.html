<!doctype html>
<meta charset="utf-8" />
<title>reverb probe</title>
<pre id="out">running</pre>
<script type="module">
  import { HeliAudio } from '/src/audio.js';
  import { BUILDINGS, helicopterPath } from '/src/city.js';
  import { occlusionAmount } from '/src/occlusion.js';
  import { computeReflections } from '/src/reflections.js';
  import { enclosureAt } from '/src/enclosure.js';
  import { forwardVector, upVector } from '/src/geometry.js';

  const audio = new HeliAudio();
  await audio.resume();
  audio.fadeIn();

  // Stand in the canyon where enclosure is high.
  const listener = [0, 1.7, 30];
  const forward = forwardVector(0);
  const up = upVector();
  const enclosure = enclosureAt(listener, BUILDINGS);

  function sampleAt(t, reverbEnabled) {
    const source = helicopterPath(t);
    const occ = occlusionAmount(listener, source, BUILDINGS);
    const reflections = computeReflections(listener, source, BUILDINGS, {
      limit: 12,
      maxOrder: 2,
    });
    audio.setReflectionsEnabled(false);
    audio.setOcclusionEnabled(true);
    audio.setReverbEnabled(reverbEnabled);
    audio.update(source, listener, forward, up, { occlusion: occ, reflections, enclosure });
    return { enclosure };
  }

  const onSamples = [];
  const offSamples = [];

  // Measure dry first, then wet, so a Convolver tail cannot inflate the off average.
  for (let phase = 0; phase < 2; phase++) {
    const wet = phase === 1;
    const bucket = wet ? onSamples : offSamples;
    const start = performance.now();
    // Wait for ConvolverNode tails to die (off) or build (on) before measuring.
    const settleSec = wet ? 1.2 : 0.8;
    const endSec = settleSec + 6;
    await new Promise((resolve) => {
      function tick() {
        const t = (performance.now() - start) / 1000;
        sampleAt(t, wet);
        if (t > settleSec) {
          const levels = audio.earLevels();
          if (levels.left + levels.right > 0.0005) {
            bucket.push(levels.left + levels.right);
          }
        }
        if (t < endSec) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / Math.max(arr.length, 1);
  const onAvg = avg(onSamples);
  const offAvg = avg(offSamples);
  const energyPass = onSamples.length > 40 && offSamples.length > 40 && onAvg > offAvg * 1.03;
  const enclosurePass = enclosure.amount > 0.2;

  const verdict = {
    pass: energyPass && enclosurePass,
    energyPass,
    enclosurePass,
    enclosureAmount: enclosure.amount,
    rt60Sec: enclosure.rt60Sec,
    avgEnergyReverbOn: onAvg,
    avgEnergyReverbOff: offAvg,
    ratio: offAvg > 0 ? onAvg / offAvg : null,
    onSamples: onSamples.length,
    offSamples: offSamples.length,
    contextState: audio.earLevels().contextState,
  };
  document.getElementById('out').textContent = ['REVERB_PROBE', JSON.stringify(verdict)].join('=');
</script>
