# Cloudflare Workers configuration for mapvelopes.
#
# This project has no index.html, so the GitHub Pages workflows skip it; it is
# deployed to Cloudflare by `deploy-workers.yml` on pushes to `main` (using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets). To deploy it
# yourself you need a Cloudflare account and `wrangler`/`worker-build`; see
# README.md.

name = "mapvelopes-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-11-01"

# Build the wasm Worker from Rust. `worker-build` wraps `cargo build
# --target wasm32-unknown-unknown` and emits the JS shim referenced by `main`.
#
# worker-build releases in lockstep with the `worker` crate, so install the
# version that matches the locked `worker` (`cargo pkgid worker`). It reads
# the wasm-bindgen version from Cargo.lock and downloads the matching CLI.
# Build the *tool* with stable, while worker-build compiles this crate with
# rust-toolchain.toml.
[build]
command = "cargo +stable install -q worker-build@$(cargo pkgid worker | cut -d@ -f2) && worker-build --release"

# GOOGLE_MAPS_API_KEY is a secret, not a var. Envelope generation fails
# until it is bound:
#   wrangler secret put GOOGLE_MAPS_API_KEY
# Restrict the key to Geocoding, Directions, and Maps Static. Do not use
# HTTP-referrer restrictions; Workers and the CLI send no matching Referer.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true
