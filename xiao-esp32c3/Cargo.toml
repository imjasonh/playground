[package]
name = "xiao-esp32c3"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Seeed Studio XIAO ESP32C3 firmware: phase/power profiling + e-paper refresh telemetry over BLE advertisements"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
name = "xiao_esp32c3"
path = "src/lib.rs"

[[bin]]
name = "xiao-esp32c3"
path = "src/main.rs"
harness = false
required-features = ["firmware"]

[features]
default = []
# Device firmware (esp-idf HAL + NimBLE). Host `cargo test` leaves this off.
firmware = []

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
esp-idf-svc = { version = "0.53", features = ["std", "native", "binstart"] }
esp32-nimble = "0.13"
hex = "0.4"
log = "0.4"
sha2 = "0.11"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"

[lints.rust]
unused = "deny"
