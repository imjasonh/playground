<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ece7dc" />
    <meta
      name="description"
      content="Fetch a Laya checkpoint in this tab, compile the graph to WebGPU, and answer typed questions. Weights stay on the device."
    />
    <title>Laya Web</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <h1>Laya Web</h1>
        <p id="gpu-status" class="lede"></p>
      </header>

      <section class="panel" aria-labelledby="model-heading">
        <h2 id="model-heading">Model</h2>
        <label>
          <span>Checkpoint</span>
          <select id="model"></select>
        </label>
        <div class="row">
          <button type="button" id="compile" class="primary">Fetch and compile</button>
          <button type="button" id="unload" disabled>Unload</button>
        </div>
        <progress id="progress" hidden></progress>
        <p id="model-status" class="status" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="ask-heading">
        <h2 id="ask-heading">Ask</h2>
        <label>
          <span>Preset</span>
          <select id="preset"></select>
        </label>
        <label>
          <span>State</span>
          <textarea id="state" rows="5"></textarea>
        </label>
        <div id="questions"></div>
        <div class="row">
          <button type="button" id="add-question">Add question</button>
          <button type="button" id="run" class="primary" disabled>Run</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="result-heading">
        <h2 id="result-heading">Answers</h2>
        <p id="result-empty" class="empty">Compile a model, then run a question.</p>
        <div id="result"></div>
      </section>

      <section class="panel" aria-labelledby="log-heading">
        <h2 id="log-heading">Log</h2>
        <pre id="log" class="log"></pre>
      </section>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
