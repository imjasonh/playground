[package]
name = "esp32-eink"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "esp32-eink"
harness = false

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
base64 = "0.23"
embedded-graphics = "0.8"
embedded-svc = "0.29"
epd-waveshare = { git = "https://github.com/rust-embedded-community/epd-waveshare.git", rev = "8fc19ae69aa7b1243953935dd8b6c076950e6ee7", default-features = false, features = ["graphics"] }
esp-idf-svc = "0.52"
esp32-blinky = { path = ".." }
sha2 = "0.11"
sunset = { version = "=0.6.0", default-features = false }
tracing = { version = "0.1", features = ["log-always"] }
zeroize = "1"

[build-dependencies]
embuild = "0.33"
