[package]
name = "whbiab"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Records one use of a CLI in the wehadababyitsaboy usage-tracking bucket"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4", default-features = false, features = ["std"] }
# Blocking HTTPS client (rustls), the same one git-fuse uses.
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints.rust]
unused = "deny"
