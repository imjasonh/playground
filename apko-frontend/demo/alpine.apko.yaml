# syntax=localhost:5000/apko-frontend
#
# A curl image from Alpine packages. The packages fall into four layers by
# origin, under a top layer with the accounts, /data, and the apk database.
contents:
  keyring:
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - curl
entrypoint:
  command: /usr/bin/curl
cmd: --version
environment:
  FOO: bar
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
archs:
  - x86_64
  - aarch64
layering:
  strategy: origin
  budget: 4
annotations:
  org.opencontainers.image.title: curl
  org.opencontainers.image.vendor: apko-frontend demo
