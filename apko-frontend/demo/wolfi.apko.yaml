# syntax=localhost:5000/apko-frontend
#
# The configuration of apko's wolfi-base example, with origin layering.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
entrypoint:
  command: /bin/sh -l
archs:
  - x86_64
  - aarch64
layering:
  strategy: origin
  budget: 10
