<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1c24" />
    <meta
      name="description"
      content="Fetch a git repository's packfile through a CORS proxy and explore its objects, deltas, and resolved file contents in the browser."
    />
    <title>Packfile explorer</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <a class="brand-name" href="./">Packfile explorer</a>
      </div>
      <form id="fetch-form" class="fetch" autocomplete="off">
        <label class="sr-only" for="repo">Repository</label>
        <input
          id="repo"
          name="repo"
          type="text"
          inputmode="url"
          spellcheck="false"
          placeholder="owner/repo or https://…"
          required
        />
        <label class="depth">
          Depth
          <input id="deepen" name="deepen" type="number" min="1" max="50" value="1" />
        </label>
        <button type="submit" id="fetch-btn">Fetch pack</button>
        <label class="file-btn">
          Open .pack
          <input id="pack-file" type="file" accept=".pack,application/octet-stream" hidden />
        </label>
      </form>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="saved" class="saved" hidden>
      <h2>Saved packs</h2>
      <ul id="saved-list"></ul>
    </section>

    <main id="workspace" class="workspace" hidden>
      <aside class="sidebar">
        <section id="stats" class="stats"></section>
        <div class="filters">
          <label>
            Type
            <select id="filter-type">
              <option value="">All</option>
              <option value="commit">commit</option>
              <option value="tree">tree</option>
              <option value="blob">blob</option>
              <option value="tag">tag</option>
              <option value="unresolved">unresolved</option>
            </select>
          </label>
          <label>
            Delta
            <select id="filter-delta">
              <option value="">All</option>
              <option value="none">none</option>
              <option value="ofs">ofs</option>
              <option value="ref">ref</option>
            </select>
          </label>
          <label>
            Sort
            <select id="filter-sort">
              <option value="offset">offset</option>
              <option value="packed">packed size</option>
              <option value="inflated">inflated size</option>
              <option value="depth">delta depth</option>
              <option value="type">type</option>
            </select>
          </label>
          <label class="search">
            OID prefix
            <input id="filter-search" type="search" spellcheck="false" placeholder="aa11…" />
          </label>
        </div>
        <ol id="object-list" class="object-list"></ol>
      </aside>
      <section id="detail" class="detail" aria-live="polite">
        <p class="empty">Select an object to inspect it.</p>
      </section>
    </main>

    <noscript>
      <p class="noscript">This app needs JavaScript to fetch and parse packfiles.</p>
    </noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
