[package]
name = "tank-commander"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Monte Carlo balance/fun simulator for the Tank Commander tabletop rules"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[[bin]]
name = "tank-commander"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unused = "deny"
