# Cloudflare Workers configuration for the App Attest handshake backend.
#
# This project has no index.html, so the GitHub Pages workflows skip it; it is
# deployed to Cloudflare by `deploy-workers.yml` on pushes to `main` (using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets). The KV namespace
# id below is a placeholder; deploy create-or-gets the real namespace.

name = "app-attest"
main = "build/worker/shim.mjs"
compatibility_date = "2025-04-01"

# Build the wasm Worker from Rust. `worker-build` wraps `cargo build
# --target wasm32-unknown-unknown` and emits the JS shim referenced by `main`.
#
# worker-build is major-version-locked with `worker` (0.8.x ↔ 0.8.x) and bundles
# wasm-bindgen CLI 0.2.125, which must match the library pin in Cargo.toml.
# Build the *tool* with stable — its deps need a recent Cargo — while
# worker-build compiles this crate with rust-toolchain.toml.
[build]
command = "cargo +stable install -q worker-build@0.8.5 && worker-build --release"

# Public configuration. APP_ID is `<Team ID>.<Bundle ID>` for the Playground
# host app. The Team ID is not a secret; it is in every signed build.
[vars]
APP_ID = "W5LPA2QM2W.io.github.imjasonh.playground"
# Set to "1" only for local wrangler / Simulator testing. Production stays off.
ALLOW_UNATTESTED = "0"
# Optional. When set, POST /v1/whoami returns 403 if Apple's 30-day key count
# for this app on the device is above the number. Leave unset to record the
# metric without rejecting.
# MAX_RISK_METRIC = "8"

# KV stores one-time challenges and attested device rows.
[[kv_namespaces]]
binding = "STORE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Optional secrets for Apple's fraud-metric refresh (`wrangler secret put`):
#   DEVICECHECK_KEY_ID         App Store Connect DeviceCheck key id
#   DEVICECHECK_PRIVATE_KEY    PKCS #8 PEM for that key
# Without them the Worker still attests and verifies assertions; it just
# cannot read the 30-day key-count metric.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
