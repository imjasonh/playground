name: Update dependencies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # pasta:ignore missing_value

permissions:
  contents: write
  pull-requests: write
  id-token: write # Octo STS OIDC federation

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Update, build, and test apps
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Baseline stable toolchain; an app's rust-toolchain.toml (e.g. web-push
      # pins 1.83) overrides it per directory when cargo runs. Use the
      # runner's preinstalled rustup instead of dtolnay/rust-toolchain.
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      # Ecosystems are independent (distinct lockfiles); run them concurrently.
      # Nested step ids remain addressable after the group so later publish
      # steps can read result / has_changes outputs.
      - parallel:
          - name: Update, build, and test every Go app
            id: update_go
            run: bash .github/scripts/update-go-dependencies.sh

          - name: Update and test every JavaScript app
            id: update_js
            run: bash .github/scripts/update-js-dependencies.sh

          - name: Update, build, and test every Rust app
            id: update_rust
            run: bash .github/scripts/update-rust-dependencies.sh

      # App token (not GITHUB_TOKEN) so the automation PR triggers required
      # checks and can enable auto-merge onto protected main.
      - name: Federate GitHub App token via Octo STS
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: imjasonh/playground
          identity: dependency-updates

      - name: Open a pull request for passing updates
        id: pr_success
        if: >-
          ${{
            steps.update_go.outputs.result == 'success' &&
            steps.update_js.outputs.result == 'success' &&
            steps.update_rust.outputs.result == 'success' &&
            (
              steps.update_go.outputs.has_changes == 'true' ||
              steps.update_js.outputs.has_changes == 'true' ||
              steps.update_rust.outputs.has_changes == 'true'
            )
          }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/manage-dependency-update.sh open-success-pr

      - name: Enable auto-merge for passing updates
        if: >-
          ${{
            steps.update_go.outputs.result == 'success' &&
            steps.update_js.outputs.result == 'success' &&
            steps.update_rust.outputs.result == 'success' &&
            (
              steps.update_go.outputs.has_changes == 'true' ||
              steps.update_js.outputs.has_changes == 'true' ||
              steps.update_rust.outputs.has_changes == 'true'
            )
          }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_NUMBER: ${{ steps.pr_success.outputs.pull-request-number }}
        run: |
          if [[ -z "${PR_NUMBER}" ]]; then
            PR_NUMBER=$(gh pr list \
              --head automation/dependency-updates \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "::error::No dependency-update pull request found to auto-merge"
            exit 1
          fi
          bash .github/scripts/manage-dependency-update.sh enable-auto-merge "${PR_NUMBER}"

      - name: Open a pull request when automatic update fails
        id: pr_failure
        if: >-
          ${{
            steps.update_go.outputs.result == 'failure' ||
            steps.update_js.outputs.result == 'failure' ||
            steps.update_rust.outputs.result == 'failure'
          }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/manage-dependency-update.sh open-failure-pr

      - name: Close a stale dependency-update pull request
        if: >-
          ${{
            steps.update_go.outputs.result == 'success' &&
            steps.update_js.outputs.result == 'success' &&
            steps.update_rust.outputs.result == 'success' &&
            steps.update_go.outputs.has_changes != 'true' &&
            steps.update_js.outputs.has_changes != 'true' &&
            steps.update_rust.outputs.has_changes != 'true'
          }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/manage-dependency-update.sh close-stale

      - name: Report unsuccessful automatic update
        if: >-
          ${{
            steps.update_go.outputs.result == 'failure' ||
            steps.update_js.outputs.result == 'failure' ||
            steps.update_rust.outputs.result == 'failure'
          }}
        run: bash .github/scripts/manage-dependency-update.sh report-failure
