name: Test

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions: write lets the cache saves on main delete the entries they replace.
permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover changed browser and Go apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

      # Install toolchains sequentially so PATH is ready before the parallel
      # test group. Each setup stays conditional so unchanged ecosystems pay
      # nothing. setup-node also runs when Go's node-image module changed
      # (its conformance tests need node/pnpm on PATH).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.discover.outputs.apps != '[]' || contains(steps.discover.outputs.modules, 'node-image') }}
        with:
          node-version: '24'

      # Go toolchain for Go modules and/or the pasta style leg (pasta is a
      # Go module; the pasta leg builds the CLI even when no other Go app
      # changed).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        id: setup-go
        if: ${{ steps.discover.outputs.modules != '[]' || steps.discover.outputs.pasta == 'true' }}
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      # Caches. Each one is restored by key prefix, because the daily
      # dependency update changes every lockfile hash and an exact match
      # would almost never hit. Only pushes to main save, after the tests, so
      # a pull request doesn't spend time uploading a cache that no other
      # run can read.
      #
      # A restore by prefix plus a save of everything on disk grows without
      # bound: every save held all that earlier jobs had added, and the Go
      # archive passed 4 GB and filled a runner's disk while it extracted.
      # So a saved cache is a function of the current commit and a size
      # budget, measured on disk because that is what an extraction has to
      # fit. The key names the commit, a trim or a size check bounds the
      # contents, and the save action deletes the entry it replaces, which
      # leaves one entry per cache and keeps the repository under its quota.
      #
      # Go: only the build cache. The module cache is 3 GB of zip files and
      # sources that `go build` downloads in seconds, and the build cache
      # hits without it.
      - name: Restore the Go build cache
        id: go-cache
        if: ${{ steps.setup-go.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # npm: the content-addressed package cache, which `npm ci` reads for
      # the browser apps and `npx` reads for the pinned Wrangler. The
      # extracted _npx directory is not cached, because it is larger than
      # the packages it comes from.
      - name: Restore the npm cache
        if: ${{ steps.discover.outputs.apps != '[]' || steps.discover.outputs.rust != '[]' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-cacache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            npm-cacache-${{ runner.os }}-

      # Rust: the tools that each Worker's wrangler.toml installs with
      # `cargo install`, which take half a minute to build. Compiled
      # dependencies are not cached: a restored target directory saves about
      # as long as it takes to restore, and it is gigabytes.
      - name: Restore the Rust tools
        if: ${{ steps.discover.outputs.rust != '[]' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-tools-${{ runner.os }}-

      # Baseline stable toolchain; an app's rust-toolchain.toml (e.g. web-push
      # pins 1.83) overrides it per directory when cargo runs. Use the
      # runner's preinstalled rustup instead of dtolnay/rust-toolchain.
      - name: Install Rust stable
        if: ${{ steps.discover.outputs.rust != '[]' }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      # Ecosystems are independent; overlap their wall time like deps.yaml.
      - parallel:
          - name: Run tests for changed apps
            if: ${{ steps.discover.outputs.apps != '[]' }}
            env:
              APPS: ${{ steps.discover.outputs.apps }}
            run: bash .github/scripts/test-browser-apps.sh

          - name: Format, build, and test changed Go apps
            if: ${{ steps.discover.outputs.modules != '[]' }}
            env:
              MODULES: ${{ steps.discover.outputs.modules }}
            run: bash .github/scripts/test-go-modules.sh

          # A kind test mostly waits for a cluster and its Pods, so each runs
          # beside the unit tests instead of after them.
          - name: kind e2e for git-k8s
            if: ${{ contains(fromJSON(steps.discover.outputs.modules), 'git-k8s') }}
            run: bash .github/scripts/test-kind-e2e.sh git-k8s

          - name: kind e2e for kube
            if: ${{ contains(fromJSON(steps.discover.outputs.modules), 'kube') }}
            run: bash .github/scripts/test-kind-e2e.sh kube

          - name: kind e2e for sshapp
            if: ${{ contains(fromJSON(steps.discover.outputs.modules), 'sshapp') }}
            run: bash .github/scripts/test-kind-e2e.sh sshapp

          - name: Lint, build, and test changed Rust apps
            if: ${{ steps.discover.outputs.rust != '[]' }}
            env:
              RUST_APPS: ${{ steps.discover.outputs.rust }}
              CARGO_INSTALL_ROOT: ${{ runner.temp }}/cargo-tools
            run: bash .github/scripts/test-rust-apps.sh

          - name: pasta test and lint
            if: ${{ steps.discover.outputs.pasta == 'true' }}
            run: bash .github/scripts/test-pasta.sh

          - name: Test posts catalog
            if: ${{ steps.discover.outputs.blog == 'true' }}
            run: bash .github/scripts/test-blog.sh

          - name: Test site index
            if: ${{ steps.discover.outputs.index == 'true' }}
            run: bash .github/scripts/test-index.sh

          - name: Test the cache and discovery scripts
            if: ${{ steps.discover.outputs.pasta == 'true' }}
            run: |
              bash .github/scripts/cache-scripts_test.sh
              bash .github/scripts/discover-rust-apps_test.sh

      - name: Trim the Go build cache
        id: trim-go
        if: ${{ github.ref == 'refs/heads/main' && steps.setup-go.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/trim-go-build-cache.sh

      - name: Save the Go build cache
        if: ${{ steps.trim-go.outcome == 'success' }}
        uses: ./.github/actions/save-cache
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          prefixes: |
            go-build-${{ runner.os }}-
            go-${{ runner.os }}-
          max-bytes: 3221225472
          token: ${{ github.token }}

      # An npm cache over its budget is deleted, not saved, because the
      # packages that older lockfiles and Wrangler versions needed stay in it.
      # The next run on main saves a fresh one.
      - name: Save the npm cache
        if: ${{ github.ref == 'refs/heads/main' && (steps.discover.outputs.apps != '[]' || steps.discover.outputs.rust != '[]') }}
        uses: ./.github/actions/save-cache
        with:
          path: ~/.npm/_cacache
          key: npm-cacache-${{ runner.os }}-${{ github.sha }}
          prefixes: npm-cacache-${{ runner.os }}-
          max-bytes: 1610612736
          token: ${{ github.token }}

      - name: Save the Rust tools
        if: ${{ github.ref == 'refs/heads/main' && steps.discover.outputs.rust != '[]' }}
        uses: ./.github/actions/save-cache
        with:
          path: ${{ runner.temp }}/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ github.sha }}
          prefixes: cargo-tools-${{ runner.os }}-
          max-bytes: 268435456
          token: ${{ github.token }}
