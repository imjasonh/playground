name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed browser and Go apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

      # Install toolchains sequentially so PATH is ready before the parallel
      # test group. Each setup stays conditional so unchanged ecosystems pay
      # nothing. setup-node also runs when Go's node-image module changed
      # (its conformance tests need node/pnpm on PATH).
      - uses: actions/setup-node@v4
        if: ${{ steps.discover.outputs.apps != '[]' || contains(steps.discover.outputs.modules, 'node-image') }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Go toolchain for Go modules and/or the pasta style leg (pasta is a
      # Go module; the pasta leg builds the CLI even when no other Go app
      # changed).
      - uses: actions/setup-go@v6
        if: ${{ steps.discover.outputs.modules != '[]' || steps.discover.outputs.pasta == 'true' }}
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      # Baseline stable toolchain; an app's rust-toolchain.toml (e.g. web-push
      # pins 1.83) overrides it per directory when cargo runs.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.discover.outputs.rust != '[]' }}
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Ecosystems are independent; overlap their wall time like deps.yaml.
      - parallel:
          - name: Run tests for changed apps
            if: ${{ steps.discover.outputs.apps != '[]' }}
            env:
              APPS: ${{ steps.discover.outputs.apps }}
            run: bash .github/scripts/test-browser-apps.sh

          - name: Build and test changed Go apps
            if: ${{ steps.discover.outputs.modules != '[]' }}
            env:
              MODULES: ${{ steps.discover.outputs.modules }}
            run: bash .github/scripts/test-go-modules.sh

          - name: Lint, build, and test changed Rust apps
            if: ${{ steps.discover.outputs.rust != '[]' }}
            env:
              RUST_APPS: ${{ steps.discover.outputs.rust }}
            run: bash .github/scripts/test-rust-apps.sh

          - name: pasta test and lint
            if: ${{ steps.discover.outputs.pasta == 'true' }}
            run: bash .github/scripts/test-pasta.sh
