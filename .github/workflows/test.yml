name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed browser and Go apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

      - uses: actions/setup-node@v4
        if: ${{ steps.discover.outputs.apps != '[]' || contains(steps.discover.outputs.modules, 'node-image') }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Run tests for changed apps
        if: ${{ steps.discover.outputs.apps != '[]' }}
        env:
          APPS: ${{ steps.discover.outputs.apps }}
        run: bash .github/scripts/test-browser-apps.sh

      - uses: actions/setup-go@v6
        if: ${{ steps.discover.outputs.modules != '[]' }}
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Build and test changed Go apps
        if: ${{ steps.discover.outputs.modules != '[]' }}
        env:
          MODULES: ${{ steps.discover.outputs.modules }}
        run: bash .github/scripts/test-go-modules.sh

      # Baseline stable toolchain; an app's rust-toolchain.toml (e.g. web-push
      # pins 1.83) overrides it per directory when cargo runs.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.discover.outputs.rust != '[]' }}
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Lint, build, and test changed Rust apps
        if: ${{ steps.discover.outputs.rust != '[]' }}
        env:
          RUST_APPS: ${{ steps.discover.outputs.rust }}
        run: bash .github/scripts/test-rust-apps.sh

  # Real Firecracker microVM tests. Free ubuntu-latest x86_64 runners expose
  # nested virt (/dev/kvm) since 2024; we only need a udev rule + root for TAP.
  sshcloud-kvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

      - name: Skip if sshcloud unchanged
        id: gate
        run: |
          if echo '${{ steps.discover.outputs.modules }}' | grep -q '"sshcloud"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "sshcloud not in changed Go modules; skipping KVM e2e"
          fi

      - uses: actions/setup-go@v6
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Enable KVM device access
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo modprobe kvm 2>/dev/null || true
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in $(seq 1 20); do
            if [[ -e /dev/kvm ]] && [[ -r /dev/kvm ]] && [[ -w /dev/kvm ]]; then
              ls -l /dev/kvm
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::/dev/kvm unavailable on this runner (nested virt not exposed)"
          ls -l /dev/kvm 2>&1 || true
          exit 1

      - name: Install rootfs / TAP tooling
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs iproute2

      - name: Run Firecracker KVM e2e
        if: steps.gate.outputs.run == 'true'
        working-directory: sshcloud
        # Firecracker runs as the runner user; `ip` for TAP uses passwordless sudo.
        run: bash hack/run-kvm-e2e.sh
