name: Publish ESP32 e-ink OTA

on:
  push:
    branches: [main]
    paths:
      - "esp32/**"
      - ".github/workflows/esp32-publish.yml"
  workflow_dispatch:

concurrency:
  group: esp32-eink-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            esp32
            esp32/tools/publisher
          shared-key: esp32-eink-publish

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Write registry credentials
        working-directory: esp32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'export GH_TOKEN=%q\n' "$GH_TOKEN" > gh.env
          chmod 600 gh.env

      - name: Build, push, and sign e-ink firmware
        working-directory: esp32
        env:
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
        run: make APP=eink publish
