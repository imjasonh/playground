name: iOS bootstrap label

# Label PRs that need a signing re-bootstrap (new App ID capability /
# entitlement, or a new extension Bundle ID). Merge handling:
# ios-bootstrap-on-merge.yml.
#
# In-app experiments without new entitlements do not need bootstrap.
# A macOS CLI tool under ios/ (type: tool) must not get the label.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ios-bootstrap-label-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync needs-ios-bootstrap label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          label=needs-ios-bootstrap
          git fetch --no-tags origin "$BASE_REF"
          range="origin/${BASE_REF}...HEAD"
          needed="$(bash .github/scripts/ios-needs-bootstrap.sh "$range")"

          gh label create "$label" --description "iOS change needs signing re-bootstrap before TestFlight" --color D93F0B 2>/dev/null || true
          if [ "$needed" = true ]; then
            gh pr edit "$PR" --add-label "$label"
            echo "Labeled #$PR with $label"
          else
            gh pr edit "$PR" --remove-label "$label" 2>/dev/null || true
            echo "No bootstrap needed for #$PR"
          fi
