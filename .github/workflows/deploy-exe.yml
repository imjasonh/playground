name: Deploy exe.dev apps

on:
  push:
    branches: [main]
  # Manual "Run workflow": redeploy every exe.dev app on demand.
  workflow_dispatch: {}

concurrency:
  group: deploy-exe
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover exe.dev apps to deploy
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-exe.sh

  deploy:
    needs: discover
    if: ${{ needs.discover.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.app }}/go.mod
          cache-dependency-path: ${{ matrix.app }}/go.sum

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Ensure Terraform state R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/ensure-terraform-r2-bucket.sh

      - name: Mint short-lived R2 S3 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/mint-r2-temp-credentials.sh

      - name: Mint exe.dev API token
        env:
          EXEDEV_SSH_PRIVATE_KEY: ${{ secrets.EXEDEV_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/mint-exedev-token.sh

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AWS_* come from mint-r2-temp-credentials.sh via GITHUB_ENV (incl. session token).
      - name: Terraform init
        working-directory: ${{ matrix.app }}/iac
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

      - name: Build and push image (ko_build)
        working-directory: ${{ matrix.app }}/iac
        # EXEDEV_TOKEN is set on the job env by mint-exedev-token.sh via GITHUB_ENV.
        run: terraform apply -input=false -auto-approve -target=ko_build.app

      - name: Make GHCR package public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: playground/${{ matrix.app }}
        run: bash .github/scripts/make-ghcr-package-public.sh

      - name: Terraform apply
        working-directory: ${{ matrix.app }}/iac
        run: terraform apply -input=false -auto-approve
