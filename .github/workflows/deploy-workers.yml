name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  # Manual "Run workflow": redeploy every Worker app on demand (e.g. to roll a
  # config/secret change that didn't touch the app's own directory).
  workflow_dispatch: {}

# Worker deploys are independent of the GitHub Pages publish, but serialize
# among themselves so two pushes don't race the same Cloudflare deployment.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Select the Worker apps to deploy: the ones this push changed, or every app
  # on the first push and on a manual workflow_dispatch.
  discover:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.discover.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover Worker apps to deploy
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-workers.sh

  deploy:
    needs: discover
    if: ${{ needs.discover.outputs.workers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # Deploy each Worker independently; one failing deploy shouldn't cancel
      # the others.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.workers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Each Worker app pins its toolchain via rust-toolchain.toml; rustup honors
      # it when cargo runs in the app directory. wrangler's [build] command
      # (worker-build) compiles the wasm artifact during deploy.
      - name: Install Rust stable (wasm target)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target wasm32-unknown-unknown
          rustup default stable

      - name: Deploy ${{ matrix.app }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.app }}
          # wrangler-action v4 defaults to latest wrangler v4; pin a known
          # version so deploys stay reproducible. Bump this periodically (the
          # dependency-update bot doesn't manage it).
          wranglerVersion: "4.107.0"
          # Before deploying, create-or-get the KV namespaces this Worker needs
          # (rewriting the placeholder ids in wrangler.toml with the real ones),
          # create any R2 buckets it declares that don't exist yet, and apply
          # remote D1 migrations for declared [[d1_databases]].
          preCommands: |
            python3 "$GITHUB_WORKSPACE/.github/scripts/provision-worker-kv.py"
            python3 "$GITHUB_WORKSPACE/.github/scripts/provision-worker-r2.py"
            python3 "$GITHUB_WORKSPACE/.github/scripts/provision-worker-d1.py"
          # After deploying (the script now exists), get-or-generate its
          # VAPID_PRIVATE_KEY secret. Both commands inherit CLOUDFLARE_API_TOKEN
          # and CLOUDFLARE_ACCOUNT_ID from wrangler-action and run in the app dir.
          postCommands: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-worker-vapid.sh"
