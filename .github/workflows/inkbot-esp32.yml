# Host tests + Xtensa cross-build for the inkbot e-ink firmware.
#
# inkbot-esp32/ is excluded from the shared Rust job in test.yml (stable
# Linux Cargo cannot build xtensa-esp32-espidf). This workflow always runs on
# PRs/pushes. Expensive jobs always report a status (so they can be required
# checks) but no-op successfully when discovery finds no firmware changes —
# same idea as ios.yml / macos.yml, without job-level `if:` skips that leave
# required checks pending.

name: inkbot-esp32

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: inkbot-esp32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Keyless Cosign on main needs a GitHub OIDC token for Fulcio.
  id-token: write

jobs:
  # Cheap Linux job: decide whether firmware work is needed before installing
  # toolchains / cross-building.
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      inkbot_esp32: ${{ steps.discover.outputs.inkbot_esp32 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover changed inkbot-esp32 firmware
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'inkbot_esp32=["inkbot-esp32"]' >> "$GITHUB_OUTPUT"
            echo "Manual run: testing inkbot-esp32."
            exit 0
          fi
          bash .github/scripts/discover-changed-apps.sh

  host:
    name: Host lib tests
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        id: gate
        run: |
          if [ "${{ needs.discover.outputs.inkbot_esp32 }}" = '[]' ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No inkbot-esp32 changes; host tests no-op."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        if: steps.gate.outputs.run == 'true'

      # rust-toolchain.toml in inkbot-esp32 pins 1.88 for host checks.
      - name: Install Rust 1.88
        if: steps.gate.outputs.run == 'true'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update \
            --component clippy --component rustfmt
          rustup default 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: inkbot-esp32
          shared-key: inkbot-esp32-host

      - name: Format, lint, and test (host)
        if: steps.gate.outputs.run == 'true'
        working-directory: inkbot-esp32
        run: |
          cargo fmt --check
          cargo clippy --lib --locked -- -D warnings
          cargo test --lib --locked

  firmware:
    name: Cross-build firmware
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate
        id: gate
        run: |
          if [ "${{ needs.discover.outputs.inkbot_esp32 }}" = '[]' ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No inkbot-esp32 changes; firmware build no-op."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        if: steps.gate.outputs.run == 'true'

      - name: Install native build tools
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Setup Xtensa toolchain
        if: steps.gate.outputs.run == 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: inkbot-esp32
          shared-key: inkbot-esp32-firmware

      # Bake placeholder Wi-Fi / URL so the build doesn't need secrets.
      - name: Prepare config.toml
        if: steps.gate.outputs.run == 'true'
        working-directory: inkbot-esp32
        run: cp config.toml.example config.toml

      - name: Build firmware
        if: steps.gate.outputs.run == 'true'
        working-directory: inkbot-esp32
        run: make build

      # Sigstore keyless provenance for the inkbot ELF (see docs/sigstore-ota.md).
      # Runs on main only: fork PRs do not get a usable release identity.
      - name: Install Cosign
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign firmware (keyless)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: inkbot-esp32
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          ELF="target/xtensa-esp32-espidf/release/inkbot-esp32"
          BUNDLE="${ELF}.sigstore.json"
          cosign sign-blob --yes --bundle "$BUNDLE" "$ELF"
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/inkbot-esp32.yml@refs/heads/main"
          cosign verify-blob \
            --bundle "$BUNDLE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" \
            "$ELF"
          echo "Signed and verified $ELF as $IDENTITY"

      - name: Upload signed firmware artifacts
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkbot-esp32-sigstore
          path: |
            inkbot-esp32/target/xtensa-esp32-espidf/release/inkbot-esp32
            inkbot-esp32/target/xtensa-esp32-espidf/release/inkbot-esp32.sigstore.json
          if-no-files-found: error
          retention-days: 30
