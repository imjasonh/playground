# Host tests + Xtensa cross-build for the inkbot e-ink firmware.
#
# inkbot-esp32/ is excluded from the shared Rust job in test.yml (stable
# Linux Cargo cannot build xtensa-esp32-espidf). This workflow owns it,
# mirroring the pattern from the earlier esp32 e-ink prototype.

name: inkbot-esp32

on:
  pull_request:
    paths:
      - "inkbot-esp32/**"
      - ".github/workflows/inkbot-esp32.yml"
  push:
    branches: [main]
    paths:
      - "inkbot-esp32/**"
      - ".github/workflows/inkbot-esp32.yml"
  workflow_dispatch:

concurrency:
  group: inkbot-esp32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Host lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml in inkbot-esp32 pins 1.88 for host checks.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkbot-esp32
          shared-key: inkbot-esp32-host

      - name: Format, lint, and test (host)
        working-directory: inkbot-esp32
        run: |
          cargo fmt --check
          cargo clippy --lib --locked -- -D warnings
          cargo test --lib --locked

  firmware:
    name: Cross-build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkbot-esp32
          shared-key: inkbot-esp32-firmware

      # Bake placeholder Wi-Fi / URL so the build doesn't need secrets.
      - name: Prepare config.toml
        working-directory: inkbot-esp32
        run: cp config.toml.example config.toml

      - name: Build firmware
        working-directory: inkbot-esp32
        run: make build
