# Builds the c3-boot demo application, signs it keylessly with production
# Sigstore (Fulcio, Rekor v2, and the Sigstore timestamp authority), and checks
# the result the way a device would, in QEMU.
#
# Only the sign job asks for id-token: write, and it runs no repository code
# besides reading the pinned files in c3-boot/release/: any step in that job
# could sign arbitrary bytes as this workflow.
#
# Same-repository pull requests sign too, so the verifier gets tested against
# production Sigstore before a merge. A pull request runs its own copy of
# this workflow, so this file can't stop a pull request from minting a token;
# anyone who can push a branch can do that with any workflow. What protects
# devices is the identity: a pull request's certificate names
# refs/pull/N/merge and the pull_request trigger, and the production identity
# policy pins refs/heads/main and push, which only a reviewed merge to the
# protected main branch can produce.
#
# The check job's trust-root blob pins the identity of the run that signed,
# so a pull request's signature is checked against the pull request's
# identity. Both the blob and the bootloader use the public development
# genesis keys, so nothing here is fit for a real device.

name: c3-release

on:
  push:
    branches: [main]
    paths:
      - "c3-boot/**"
      - ".github/workflows/c3-release.yml"
  pull_request:
    paths:
      - "c3-boot/**"
      - ".github/workflows/c3-release.yml"
  workflow_dispatch: {}

concurrency:
  group: c3-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and pack the demo application
        working-directory: c3-boot
        env:
          C3_DEMO_VERSION: ${{ github.run_number }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release --target riscv32imc-unknown-none-elf -p c3-demo-app
          cargo run --locked -p c3-ota -- pack \
            --elf target/riscv32imc-unknown-none-elf/release/c3-demo-app \
            --security-version 0 --out "${RUNNER_TEMP}/app.img"
          sha256sum "${RUNNER_TEMP}/app.img"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image
          path: ${{ runner.temp }}/app.img
          if-no-files-found: error

  sign:
    name: Sign with Sigstore
    needs: build
    # Pull requests from forks get no OIDC token, so they can't sign.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: c3-boot/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image
          path: ${{ runner.temp }}/image

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign
        run: |
          cosign sign-blob --yes \
            --signing-config c3-boot/release/signing_config.json \
            --trusted-root c3-boot/release/trusted_root.json \
            --bundle "${RUNNER_TEMP}/app.sigstore.json" \
            "${RUNNER_TEMP}/image/app.img"

      - name: Verify with cosign
        run: |
          cosign verify-blob \
            --trusted-root c3-boot/release/trusted_root.json \
            --bundle "${RUNNER_TEMP}/app.sigstore.json" \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/image/app.img"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle
          path: ${{ runner.temp }}/app.sigstore.json
          if-no-files-found: error

  check:
    name: Check like a device
    needs: [build, sign]
    runs-on: ubuntu-latest
    env:
      QEMU_RELEASE: esp-develop-9.2.2-20261109
      QEMU_ASSET: qemu-riscv32-softmmu-esp_develop_9.2.2_20261109-x86_64-linux-gnu.tar.xz
      QEMU_SHA256: afa59465495295b8aa4f804768983fa30b0bbf33d0f68a047f9caa436b9164c0
      QEMU: /tmp/qemu/bin/qemu-system-riscv32
      C3_ISSUER: https://token.actions.githubusercontent.com
      C3_BUILD_SIGNER_URI: https://github.com/${{ github.workflow_ref }}
      C3_REPOSITORY_ID: ${{ github.repository_id }}
      C3_OWNER_ID: ${{ github.repository_owner_id }}
      C3_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/release

      - name: Install Espressif QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          curl -fsSL -o /tmp/qemu.tar.xz \
            "https://github.com/espressif/qemu/releases/download/${QEMU_RELEASE}/${QEMU_ASSET}"
          echo "${QEMU_SHA256}  /tmp/qemu.tar.xz" | sha256sum -c -
          mkdir -p /tmp/qemu
          tar -xJf /tmp/qemu.tar.xz -C /tmp/qemu --strip-components=1

      - name: Check the release
        working-directory: c3-boot
        run: |
          rustup show active-toolchain || rustup toolchain install
          bash release/check.sh \
            "${RUNNER_TEMP}/release/image/app.img" \
            "${RUNNER_TEMP}/release/bundle/app.sigstore.json" \
            release/trusted_root.json \
            "${RUNNER_TEMP}/check"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: c3-release
          path: |
            ${{ runner.temp }}/release/image/app.img
            ${{ runner.temp }}/release/bundle/app.sigstore.json
            ${{ runner.temp }}/check/container.bin
            ${{ runner.temp }}/check/slot.bin
            ${{ runner.temp }}/check/boot.log
          if-no-files-found: ignore
