# App-specific: unit-test the harness, then play the real nethack binary.
#
# Unit tests use a fake screen and do not write the learning notebook.
# The play job installs nethack-console and runs the Cursor agent against
# that process. It seeds notebook/ from automation/nethack-notes when that
# branch exists, then publishes the updated notebook back to that branch.
# It does not commit notes onto the feature pull request. A failed play
# does not publish. Play jobs queue so two runs cannot overwrite the branch.
# Play uses grok-4.6 and writes the SDK token cost to the job summary.
# The notebook keeps claims that survive the screen and drops a turn log.

name: NetHack agent

on:
  pull_request:
    paths:
      - 'nethack-agent/**'
      - '.github/workflows/nethack-agent.yml'
      - '.github/scripts/publish-nethack-notes.sh'
      - '.github/scripts/publish-nethack-notes_test.sh'
  workflow_dispatch:
    inputs:
      lives:
        description: Lives in this run
        type: string
        default: '1'
      max_turns:
        description: Model turns per life
        type: string
        default: '16'
      model:
        description: Model id
        type: string
        default: grok-4.6

concurrency:
  group: nethack-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nethack-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nethack-agent/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Notes publish script test
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/publish-nethack-notes_test.sh

  play:
    needs: test
    if: github.event_name != 'pull_request' || github.head_ref != 'automation/nethack-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One writer for the notes branch. A second play waits, then seeds the
    # notebook the first play published.
    concurrency:
      group: nethack-notes
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: nethack-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nethack-agent/package-lock.json

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=CURSOR_API_KEY missing::Repo secret CURSOR_API_KEY is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Install NetHack
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nethack-console

      - name: Install
        run: npm ci

      - name: Seed notebook from notes branch
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-nethack-notes.sh seed

      - name: Play nethack
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          LIVES: ${{ github.event_name == 'workflow_dispatch' && inputs.lives || '1' }}
          MAX_TURNS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_turns || '16' }}
          MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'grok-4.6' }}
        run: |
          set -euo pipefail
          test -x /usr/games/nethack
          npx tsx src/cli.ts \
            --backend cursor \
            --game tty \
            --command /usr/games/nethack \
            --model "$MODEL" \
            --lives "$LIVES" \
            --max-turns "$MAX_TURNS" \
            --verbose

      - name: Publish notebook for the next play
        # success() is required. An explicit if replaces the default, and a
        # failed play must not publish a partial notebook.
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-nethack-notes.sh publish

      - name: Upload notebook and transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nethack-agent-${{ github.run_id }}
          path: |
            nethack-agent/notebook/
            nethack-agent/results/
          if-no-files-found: warn
