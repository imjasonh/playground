# App-specific: unit-test the harness, then play the real nethack binary.
#
# Unit tests use a fake screen and do not write the learning notebook.
# The play job installs nethack-console and runs the Cursor agent against
# that process. It resumes notebook/ and writes the updated notes back.

name: NetHack agent

on:
  pull_request:
    paths:
      - 'nethack-agent/**'
      - '.github/workflows/nethack-agent.yml'
  workflow_dispatch:
    inputs:
      lives:
        description: Lives in this run
        type: string
        default: '1'
      max_turns:
        description: Model turns per life
        type: string
        default: '16'

concurrency:
  group: nethack-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nethack-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nethack-agent/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  play:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nethack-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nethack-agent/package-lock.json

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=CURSOR_API_KEY missing::Repo secret CURSOR_API_KEY is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Install NetHack
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nethack-console

      - name: Install
        run: npm ci

      - name: Play nethack
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          LIVES: ${{ github.event_name == 'workflow_dispatch' && inputs.lives || '1' }}
          MAX_TURNS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_turns || '16' }}
        run: |
          set -euo pipefail
          test -x /usr/games/nethack
          npx tsx src/cli.ts \
            --backend cursor \
            --game tty \
            --command /usr/games/nethack \
            --lives "$LIVES" \
            --max-turns "$MAX_TURNS" \
            --verbose

      - name: Upload notebook and transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nethack-agent-${{ github.run_id }}
          path: |
            nethack-agent/notebook/
            nethack-agent/results/
          if-no-files-found: warn
