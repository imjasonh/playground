# Firmware and generated-hardware checks for the inkbot-magsafe e-paper tile.
#
# inkbot-magsafe/ is excluded from the shared Rust job in test.yml because it
# cross-compiles to the bare-metal thumbv7em-none-eabihf target, which the
# generic stable-Rust job cannot build. This workflow also checks the schematic
# contracts, BOM coverage, generated files, and routed PCB.

name: inkbot-magsafe

on:
  push:
    branches: [main]
    paths:
      - "inkbot-magsafe/**"
      - "docs/inkbot-magsafe-bom.csv"
      - "docs/inkbot-magsafe-design.md"
      - ".github/workflows/inkbot-magsafe.yml"
  pull_request:
    paths:
      - "inkbot-magsafe/**"
      - "docs/inkbot-magsafe-bom.csv"
      - "docs/inkbot-magsafe-design.md"
      - ".github/workflows/inkbot-magsafe.yml"
  workflow_dispatch: {}

concurrency:
  group: inkbot-magsafe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Host tests + ARM build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkbot-magsafe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins stable and the thumbv7em-none-eabihf target;
      # rustup installs both on the first cargo call.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup target add thumbv7em-none-eabihf

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (host)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (host logic)
        run: cargo test --locked

      - name: Reject an unqualified target image
        run: |
          if cargo check --locked --target thumbv7em-none-eabihf; then
            echo "target build succeeded without an explicit inert-image feature"
            exit 1
          fi

      - name: Clippy (thumbv7em-none-eabihf)
        run: >-
          cargo clippy --locked
          --target thumbv7em-none-eabihf
          --features bringup-stub
          -- -D warnings

      - name: Build firmware (thumbv7em-none-eabihf)
        run: |
          cargo build --locked --release \
            --target thumbv7em-none-eabihf \
            --features bringup-stub
          python3 tools/check_elf_layout.py \
            target/thumbv7em-none-eabihf/release/inkbot-magsafe \
            --flash-start 0x27000 \
            --flash-end 0x4f000

          cargo build --locked --release \
            --target thumbv7em-none-eabihf \
            --features factory-bringup
          python3 tools/check_elf_layout.py \
            target/thumbv7em-none-eabihf/release/inkbot-magsafe \
            --flash-start 0x0 \
            --flash-end 0x27000

  hardware:
    name: Schematic contracts + PCB DRC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkbot-magsafe/kicad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install KiCad
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad \
            kicad-footprints

      - name: Check generated schematic
        run: |
          python3 generate_schematic.py
          kicad-cli sch export netlist \
            -o /tmp/inkbot.net \
            inkbot-magsafe.kicad_sch
          git diff --exit-code -- inkbot-magsafe.kicad_sch

      - name: Check electrical contracts and BOM
        run: python3 run_erc.py

      - name: Check routed board
        run: python3 run_drc.py
