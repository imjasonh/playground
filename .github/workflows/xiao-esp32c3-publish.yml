# Build and push xiao-esp32c3 firmware (.bin for BLE OTA + gzipped ELF with
# line-tables-only DWARF symbols for automatic server-side symbolization in
# xiao-otel) to ghcr.io/<owner>/playground/xiao-esp32c3.

name: xiao-esp32c3 publish

on:
  push:
    branches: [main]
    paths:
      - xiao-esp32c3/**
      - .github/workflows/xiao-esp32c3-publish.yml
  workflow_dispatch: {}

concurrency:
  group: xiao-esp32c3-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish xiao-esp32c3 firmware & symbols
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        working-directory: xiao-esp32c3
        run: rustup toolchain install --no-self-update

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10

      - name: Setup ESP32-C3 toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32c3
          ldproxy: true

      - name: Restore the firmware Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            xiao-esp32c3/target
            ~/.cargo/registry
          key: cargo-esp32-firmware-xiao-esp32c3-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-esp32-firmware-xiao-esp32c3-${{ runner.os }}-

      - name: Install espflash
        working-directory: xiao-esp32c3
        run: cargo install espflash --locked --version 4.5.0

      - name: Build profiling firmware with DWARF line tables
        working-directory: xiao-esp32c3
        run: make build-profile

      - name: Export .bin and push .bin + .elf.gz to GHCR
        working-directory: xiao-esp32c3
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          ELF="target/xiao-esp32c3/riscv32imc-esp-espidf/release/xiao-esp32c3"
          BIN="target/xiao-esp32c3/xiao-esp32c3.bin"
          espflash save-image --chip esp32c3 "$ELF" "$BIN"
          OWNER_LOWER="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          python3 publish-oci.py "${OWNER_LOWER}/playground/xiao-esp32c3" "${GITHUB_SHA}" "$BIN" "$ELF"
