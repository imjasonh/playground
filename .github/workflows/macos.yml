name: macOS release

# Notarizes changed macOS apps and publishes their Sparkle updates on pushes
# to main. test.yml tests them on pull requests and on main.

on:
  push:
    branches: [main]

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Cheap Linux job: figure out whether any macOS app changed before paying for
  # a macOS runner.
  discover:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.discover.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover changed macOS apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

  ship:
    needs: discover
    if: ${{ needs.discover.outputs.macos != '[]' }}
    runs-on: macos-latest
    steps:
      - name: Check for Developer ID and Sparkle secrets
        id: secrets
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
        run: |
          if [ -n "$MACOS_DEVELOPER_ID_P12" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS release skipped::Developer ID / Sparkle secrets are not configured. See docs/macos-sparkle-setup.md."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.secrets.outputs.ship == 'true' }}
        with:
          persist-credentials: false

      - name: Select Xcode
        if: ${{ steps.secrets.outputs.ship == 'true' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: ${{ steps.secrets.outputs.ship == 'true' }}
        run: brew install xcodegen

      - name: Ship changed macOS apps
        if: ${{ steps.secrets.outputs.ship == 'true' }}
        env:
          MACOS_APPS: ${{ needs.discover.outputs.macos }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: bash .github/scripts/macos-ci.sh ship
