name: ESP32

on:
  pull_request:
    paths:
      - "esp32/**"
      - ".github/workflows/esp32.yml"
  push:
    branches: [main]
    paths:
      - "esp32/**"
      - ".github/workflows/esp32.yml"
  workflow_dispatch:

concurrency:
  group: esp32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Host tools and terminal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            esp32
            esp32/tools/provision
            esp32/tools/publisher
          shared-key: esp32-host

      - name: Test terminal model
        run: cargo test --manifest-path esp32/eink/Cargo.toml --lib --target x86_64-unknown-linux-gnu

      - name: Test provisioner
        run: cargo test --manifest-path esp32/tools/provision/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build publisher
        run: cargo build --release --manifest-path esp32/tools/publisher/Cargo.toml --target x86_64-unknown-linux-gnu

  firmware:
    name: Cross-build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp32
          shared-key: esp32-firmware

      - name: Build original firmware
        working-directory: esp32
        run: make APP=blinky build

      - name: Build e-ink SSH firmware
        working-directory: esp32
        run: make APP=eink build

      - name: Enforce OTA slot size
        working-directory: esp32
        run: |
          make APP=eink save-image
          size=$(wc -c < target/eink-firmware.bin)
          limit=$((0x1F0000))
          echo "e-ink firmware: ${size} bytes; OTA slot: ${limit} bytes"
          test "$size" -le "$limit"
