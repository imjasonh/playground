name: iOS

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux job: figure out whether any iOS app changed before paying for a
  # macOS runner. Mirrors the discovery used by the Linux test workflow.
  discover:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.discover.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover changed iOS apps
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/discover-changed-apps.sh

  ios:
    needs: discover
    if: ${{ needs.discover.outputs.ios != '[]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Bundler cache needs the committed ios/Gemfile.lock. Cuts ~30-40s of cold
      # gem resolve + native extension builds on every run.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # A push to main with signing secrets configured is the only case that
      # ships to TestFlight; everything else just builds and tests.
      - name: Determine mode
        id: mode
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$ASC_KEY_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$ASC_KEY_ID" ]; then
            echo "::warning title=TestFlight upload skipped::iOS signing secrets are not configured; ran tests only. See docs/ios-testflight-design.md."
          fi

      - name: Test and (on main) ship changed iOS apps
        env:
          IOS_APPS: ${{ needs.discover.outputs.ios }}
          DEPLOY: ${{ steps.mode.outputs.deploy }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bash .github/scripts/ios-ci.sh
