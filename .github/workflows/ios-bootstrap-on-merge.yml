name: iOS bootstrap on merge

# When a PR labeled needs-ios-bootstrap is merged, re-run signing bootstrap
# immediately. This races the normal ios.yml TestFlight build on purpose:
# bootstrap is usually much faster than the macOS build, so match profiles
# land before `fastlane beta` needs them. Keeps ios.yml unchanged.

on:
  pull_request:
    types: [closed]

concurrency:
  group: ios-bootstrap-on-merge
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'needs-ios-bootstrap')
    uses: ./.github/workflows/ios-signing-bootstrap.yml
    with:
      app: ios
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
