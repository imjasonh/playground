# Push and Cosign-sign inkbot-esp32 and maze-esp32 firmware to GHCR.
#
# Devices pull ghcr.io/imjasonh/playground/{app}:latest anonymously
# (app is NVS ota/app, default inkbot-esp32) and verify the Sigstore
# bundle against the identities in NVS. The example provisioning.toml
# allowlists this workflow @refs/heads/main.
#
# Intentionally separate from test.yml so the test workflow does not need
# packages:write / id-token:write.

name: inkbot-esp32 publish

on:
  push:
    branches: [main]
    paths:
      - inkbot-esp32/**
      - .github/workflows/inkbot-esp32-publish.yml
  workflow_dispatch: {}

concurrency:
  group: inkbot-esp32-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the host toolchain for this directory.
      - name: Install Rust
        working-directory: inkbot-esp32
        run: rustup toolchain install --no-self-update

      # test.yml's ESP32 jobs save these caches on main, and this job only
      # reads them. The host and firmware builds use separate directories
      # under inkbot-esp32/target, so both restore into one tree.
      - name: Restore the host Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            inkbot-esp32/target
            ~/.cargo/registry
          key: cargo-esp32-host-inkbot-esp32-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-esp32-host-inkbot-esp32-${{ runner.os }}-

      - name: Host tests
        working-directory: inkbot-esp32
        run: make test

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10

      - name: Setup Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7
        env:
          # espup hits api.github.com; unauthenticated runners 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - name: Restore the firmware Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            inkbot-esp32/target
            ~/.cargo/registry
          key: cargo-esp32-firmware-inkbot-esp32-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-esp32-firmware-inkbot-esp32-${{ runner.os }}-

      - name: Install Cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0

      - name: Install espflash
        # Pin 4.5.0 to match the host that flashes this board. The Xtensa
        # step above makes `esp` the default rustc, so build espflash in
        # inkbot-esp32/, where rust-toolchain.toml selects the host
        # toolchain.
        working-directory: inkbot-esp32
        run: cargo install espflash --locked --version 4.5.0

      - name: Publish signed image
        working-directory: inkbot-esp32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
        run: make publish

      - name: Pull and verify published layer
        working-directory: inkbot-esp32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make pull-verify
