# Dependabot keeps the Cloudflare Worker apps' dependencies and tooling
# current. The daily deps.yaml workflow still runs `cargo update` for every
# Rust app, which covers semver-compatible updates. Dependabot covers what
# `cargo update` can't do: requirement bumps to semver-incompatible releases,
# the Rust toolchain pin, the Wrangler version, and wrangler-action.
#
# worker-build has no pin of its own. Each Worker's build installs the
# worker-build release that matches the locked `worker` crate, so a `worker`
# bump updates both.
#
# A 7-day cooldown keeps a release that turns out to be broken or
# compromised from landing the day it's published.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /app-attest
      - /cors-proxy
      - /git-server
      - /inkbot
      - /mapvelopes
      - /web-push
      - /y
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      workers-rs:
        patterns:
          - worker
          - wasm-bindgen
          - wasm-bindgen-futures
          - js-sys
          - serde-wasm-bindgen
      # These crates share digest, elliptic-curve, and rand_core versions, so
      # a crate has to move them together.
      rustcrypto:
        patterns:
          - aes-gcm
          - getrandom
          - hkdf
          - hmac
          - p256
          - p384
          - pbkdf2
          - sha1
          - sha2

  - package-ecosystem: rust-toolchain
    directories:
      - /app-attest
      - /cors-proxy
      - /git-server
      - /inkbot
      - /mapvelopes
      - /web-push
      - /y
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-toolchain:
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /.github/wrangler
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: cloudflare/wrangler-action
