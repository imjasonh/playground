# Trust policy for the weekly c3-boot trusted-root check (c3-trust-root.yml).
# Octo STS exchanges the workflow's OIDC token for a GitHub App installation
# token so the pull request it opens triggers required checks, which
# GITHUB_TOKEN-created pull requests do not.
issuer: https://token.actions.githubusercontent.com
subject: repo:imjasonh/playground:ref:refs/heads/main

permissions:
  contents: write
  pull_requests: write
