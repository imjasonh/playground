# Trust policy for the nightly Litestream update workflow
# (update-litestream.yml). Octo STS exchanges the workflow's OIDC token for a
# GitHub App installation token so opening or updating the automation PR
# triggers required checks (GITHUB_TOKEN-created PRs do not) and can enable
# auto-merge onto main.
issuer: https://token.actions.githubusercontent.com
subject: repo:imjasonh/playground:ref:refs/heads/main

permissions:
  contents: write
  pull_requests: write
