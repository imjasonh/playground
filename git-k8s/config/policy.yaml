# Only the core program writes check results. Checks send their results to
# its results endpoint, which writes each one to the entry of the check that
# sent it, and checks have no RBAC rule to write GitBranch status. This
# policy is the backstop if a role grants one: it rejects every status write
# by a check's service account, and every change to status.checks by a
# service account other than the core program's. generate installs each
# program in a namespace with a service account of the program's name, so
# the core program runs as system:serviceaccount:git-k8s:git-k8s and the
# gofmt check as system:serviceaccount:check-gofmt:check-gofmt. People
# aren't service accounts, so RBAC alone decides whether they can write
# results.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-check-results
  annotations:
    # The core program reports PoliciesInstalled False unless each policy
    # has its policyVersion, in cmd/git-k8s/policies.go. Raise both when
    # the core program needs a change to the policies.
    git-k8s.imjasonh.com/policy-version: "2"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["git-k8s.imjasonh.com"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["gitbranches/status"]
  matchConditions:
    - name: service-accounts
      expression: request.userInfo.username.startsWith("system:serviceaccount:")
  variables:
    - name: user
      expression: request.userInfo.username.split(":")
    - name: check
      expression: >-
        size(variables.user) == 4 && variables.user[2] == variables.user[3] &&
        variables.user[3].startsWith("check-") ? variables.user[3].substring(6) : ""
    - name: core
      expression: size(variables.user) == 4 && variables.user[2] == "git-k8s" && variables.user[3] == "git-k8s"
    - name: old
      expression: >-
        has(oldObject.status) && has(oldObject.status.checks) ? oldObject.status.checks : {}
    - name: new
      expression: >-
        has(object.status) && has(object.status.checks) ? object.status.checks : {}
  validations:
    - expression: variables.check == ""
      messageExpression: >-
        "the " + variables.check + " check can't write GitBranch status; it sends its results to the core program"
    - expression: variables.check != "" || variables.core || variables.new == variables.old
      messageExpression: >-
        request.userInfo.username + " isn't the core program's service account, so it can't write status.checks"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-check-results
spec:
  policyName: git-k8s-check-results
  validationActions: [Deny]
---
# The approve annotation on a GitBranch records a person's approval, so no
# git-k8s service account can set or change it. kube lets each controller
# patch the type that it reconciles, which for a check is GitBranch, so this
# policy also stops checks from changing a GitBranch's spec, labels, or
# annotations.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-branches
  annotations:
    git-k8s.imjasonh.com/policy-version: "2"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["git-k8s.imjasonh.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["gitbranches"]
  matchConditions:
    - name: service-accounts
      expression: request.userInfo.username.startsWith("system:serviceaccount:")
  variables:
    - name: user
      expression: request.userInfo.username.split(":")
    - name: check
      expression: >-
        size(variables.user) == 4 && variables.user[2] == variables.user[3] &&
        variables.user[3].startsWith("check-") ? variables.user[3].substring(6) : ""
    - name: core
      expression: size(variables.user) == 4 && variables.user[2] == "git-k8s" && variables.user[3] == "git-k8s"
    - name: approval
      expression: >-
        has(object.metadata.annotations) && "git-k8s.imjasonh.com/approve" in object.metadata.annotations ?
        object.metadata.annotations["git-k8s.imjasonh.com/approve"] : ""
    - name: oldApproval
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        "git-k8s.imjasonh.com/approve" in oldObject.metadata.annotations ?
        oldObject.metadata.annotations["git-k8s.imjasonh.com/approve"] : ""
  validations:
    - expression: '!(variables.core || variables.check != "") || variables.approval == variables.oldApproval'
      message: git-k8s controllers can't approve branches
    - expression: >-
        variables.check == "" ||
        (oldObject != null && object.spec == oldObject.spec &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
      messageExpression: '"the " + variables.check + " check can''t change GitBranch objects"'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-branches
spec:
  policyName: git-k8s-branches
  validationActions: [Deny]
