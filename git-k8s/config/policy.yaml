# The git-k8s-check-results and git-k8s-branches policies, and the core
# program's results endpoint and mirror, read this ConfigMap to find checks
# that don't run as the service account check-NAME in the namespace
# check-NAME. Each entry maps NAMESPACE.SERVICE_ACCOUNT to a check's name,
# for example "ci.gofmt-bot: gofmt", and overrides that convention. They
# ignore an entry for the core program's service account, git-k8s.git-k8s,
# which is never a check. The core program applies this ConfigMap without
# data, so it keeps the entries that you add.
# While the ConfigMap is missing, those policies deny every write to
# GitBranch objects, including people's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-k8s-checks
  namespace: git-k8s
---
# Only the core program writes check results. Checks send their results to
# its results endpoint, which writes each one to the entry of the check that
# sent it, and checks have no RBAC rule to write GitBranch status. This
# policy is the backstop if a role grants one: it rejects every status write
# by a check's service account, and every change to status.checks or
# status.diverged by a service account other than the core program's.
# generate installs each program in a namespace with a service account of
# the program's name, so the core program runs as
# system:serviceaccount:git-k8s:git-k8s and the gofmt check as
# system:serviceaccount:check-gofmt:check-gofmt. A check installed under
# another name or namespace needs an entry in the git-k8s-checks ConfigMap.
# A check whose entry is empty can't send results, but this policy still
# treats it as a check. People aren't service accounts, so RBAC alone
# decides whether they can write results.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-check-results
  annotations:
    # The core program reports PoliciesInstalled False unless every policy
    # in this file has its policyVersion, in cmd/git-k8s/policies.go. Raise
    # policyVersion and every policy's annotation together when the core
    # program needs a change to the policies.
    git-k8s.imjasonh.com/policy-version: "4"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["git-k8s.imjasonh.com"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["gitbranches/status"]
  matchConditions:
    - name: service-accounts
      expression: request.userInfo.username.startsWith("system:serviceaccount:")
  variables:
    - name: user
      expression: request.userInfo.username.split(":")
    - name: account
      expression: 'size(variables.user) == 4 ? variables.user[2] + "." + variables.user[3] : ""'
    - name: check
      expression: >-
        variables.account == "git-k8s.git-k8s" ? "" :
        params != null && has(params.data) && variables.account in params.data ? params.data[variables.account] :
        size(variables.user) == 4 && variables.user[2] == variables.user[3] &&
        variables.user[3].startsWith("check-") ? variables.user[3].substring(6) : ""
    - name: checkAccount
      expression: >-
        variables.check != "" || variables.account != "git-k8s.git-k8s" &&
        params != null && has(params.data) && variables.account in params.data
    - name: core
      expression: size(variables.user) == 4 && variables.user[2] == "git-k8s" && variables.user[3] == "git-k8s"
    - name: old
      expression: >-
        has(oldObject.status) && has(oldObject.status.checks) ? oldObject.status.checks : {}
    - name: new
      expression: >-
        has(object.status) && has(object.status.checks) ? object.status.checks : {}
  validations:
    - expression: '!variables.checkAccount'
      messageExpression: >-
        variables.check != "" ? "the " + variables.check + " check can't write GitBranch status; it sends its results to the core program" :
        request.userInfo.username + ", a check whose entry in the git-k8s-checks ConfigMap is empty, can't write a GitBranch's status"
    - expression: variables.checkAccount || variables.core || variables.new == variables.old
      messageExpression: >-
        request.userInfo.username + " isn't the core program's service account, so it can't write status.checks"
    # The conflicts check merges or replays the commit that status.diverged
    # names, so only the core program, which runs the mirror, writes it.
    - expression: >-
        variables.checkAccount || variables.core ||
        (has(object.status) && has(object.status.diverged) ? [object.status.diverged] : []) ==
        (has(oldObject.status) && has(oldObject.status.diverged) ? [oldObject.status.diverged] : [])
      messageExpression: request.userInfo.username + " isn't the core program's service account, so it can't write status.diverged"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-check-results
spec:
  policyName: git-k8s-check-results
  paramRef:
    name: git-k8s-checks
    namespace: git-k8s
    parameterNotFoundAction: Deny
  validationActions: [Deny]
---
# The approve and approved-by annotations on a GitBranch record a person's
# approval, so no git-k8s service account can set or change them, even one
# that holds the approve verb. This policy also stops checks from changing a
# GitBranch's spec, labels, annotations, finalizers, owner references, or
# managedFields. A finalizer that nobody removes keeps a deleted branch in its
# parent's merge queue, and an owner reference to a missing object makes
# garbage collection delete the GitBranch with its approval. Without its
# entries in managedFields, the core program's server-side applies leave
# behind the fields that they stop setting, such as a branch's place in the
# merge queue. RBAC lets a check that owns objects, such as check-gotest,
# patch GitBranch objects, because generate can't tell whether an owned
# object needs a finalizer on its owner. kube adds that finalizer with a
# cleanup annotation, which this policy denies, so a check can own only
# namespaced objects in the branch's namespace. A check whose entry in the
# git-k8s-checks ConfigMap is empty can't send results, but it keeps its RBAC,
# so this policy still treats it as a check.
#
# git-k8s-deps reconciles each parent's GitBranch and owns update Pods, so
# RBAC lets it patch GitBranch objects too, and the policy stops it the same
# way.
#
# The core program copies each GitBranch's spec, including the parent's
# merge policy, from the GitRepository, so this policy lets nobody else
# create a GitBranch or change its spec, people included. Otherwise anyone
# who can patch a GitBranch, such as an approver, could change its merge
# policy and land it without its checks. People can still label and
# annotate GitBranch objects.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-branches
  annotations:
    git-k8s.imjasonh.com/policy-version: "4"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["git-k8s.imjasonh.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["gitbranches"]
  variables:
    # Only a service account's username names a namespace and a service
    # account, so a person named a:b:git-k8s:git-k8s isn't the core program.
    - name: user
      expression: >-
        request.userInfo.username.startsWith("system:serviceaccount:") ?
        request.userInfo.username.split(":") : []
    - name: account
      expression: 'size(variables.user) == 4 ? variables.user[2] + "." + variables.user[3] : ""'
    - name: check
      expression: >-
        variables.account == "git-k8s.git-k8s" ? "" :
        params != null && has(params.data) && variables.account in params.data ? params.data[variables.account] :
        size(variables.user) == 4 && variables.user[2] == variables.user[3] &&
        variables.user[3].startsWith("check-") ? variables.user[3].substring(6) : ""
    - name: checkAccount
      expression: >-
        variables.check != "" || variables.account != "git-k8s.git-k8s" &&
        params != null && has(params.data) && variables.account in params.data
    - name: core
      expression: size(variables.user) == 4 && variables.user[2] == "git-k8s" && variables.user[3] == "git-k8s"
    - name: deps
      expression: size(variables.user) == 4 && variables.user[2] == "git-k8s-deps" && variables.user[3] == "git-k8s-deps"
    - name: unchanged
      expression: >-
        oldObject != null && object.spec == oldObject.spec &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
        (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
        (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.managedFields) ? object.metadata.managedFields : []) ==
        (has(oldObject.metadata.managedFields) ? oldObject.metadata.managedFields : [])
    - name: approval
      expression: >-
        has(object.metadata.annotations) && "git-k8s.imjasonh.com/approve" in object.metadata.annotations ?
        object.metadata.annotations["git-k8s.imjasonh.com/approve"] : ""
    - name: oldApproval
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        "git-k8s.imjasonh.com/approve" in oldObject.metadata.annotations ?
        oldObject.metadata.annotations["git-k8s.imjasonh.com/approve"] : ""
    - name: approver
      expression: >-
        has(object.metadata.annotations) && "git-k8s.imjasonh.com/approved-by" in object.metadata.annotations ?
        object.metadata.annotations["git-k8s.imjasonh.com/approved-by"] : ""
    - name: oldApprover
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        "git-k8s.imjasonh.com/approved-by" in oldObject.metadata.annotations ?
        oldObject.metadata.annotations["git-k8s.imjasonh.com/approved-by"] : ""
  validations:
    - expression: >-
        !(variables.core || variables.checkAccount) ||
        (variables.approval == variables.oldApproval && variables.approver == variables.oldApprover)
      message: git-k8s controllers can't approve branches
    - expression: '!variables.checkAccount || variables.unchanged'
      messageExpression: >-
        variables.check != "" ? "the " + variables.check + " check can't change GitBranch objects" :
        request.userInfo.username + ", a check whose entry in the git-k8s-checks ConfigMap is empty, can't change GitBranch objects"
    - expression: '!variables.deps || variables.unchanged'
      message: git-k8s-deps can't change GitBranch objects
    - expression: variables.core || oldObject != null && object.spec == oldObject.spec
      messageExpression: >-
        oldObject == null ?
        request.userInfo.username + " can't create GitBranch objects; only the core program creates them" :
        request.userInfo.username + " can't change a GitBranch's spec; the core program copies it from the GitRepository"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-branches
spec:
  policyName: git-k8s-branches
  paramRef:
    name: git-k8s-checks
    namespace: git-k8s
    parameterNotFoundAction: Deny
  validationActions: [Deny]
---
# generate lets a check that declares Pods with kube.Own, such as
# check-gotest, create, patch, and delete Pods in every namespace, because
# RBAC can't limit those verbs to the Pods that a program created, and a
# repository's namespace isn't known when generate writes the program's RBAC.
# kube sets the label kube.imjasonh.github.io/controller on each object that a
# controller owns to the controller's name, which is check-NAME for the NAME
# check. This policy lets a check change or delete only Pods with its own
# label, and its new Pods must have it. Their names must be NAME-ID, where ID
# has no hyphens, so that a check can't take the name of another check's next
# Pod and block it. Two checks never share such a name, even when one check's
# name starts with the other's. A check creates and changes Pods only in
# namespaces labeled git-k8s.imjasonh.com/check-pods=true that enforce the
# latest restricted Pod Security Standard, and never in the namespaces of
# git-k8s programs. The policy itself also enforces the baseline Pod Security
# Standard, more strictly for capabilities and sysctls, because Pod Security
# admission skips the Pods that its exemptions cover.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-check-pods
  annotations:
    git-k8s.imjasonh.com/policy-version: "4"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["pods", "pods/ephemeralcontainers", "pods/resize", "pods/status"]
  # Every Pod write in the cluster matches, so this condition skips service
  # accounts whose namespace and name don't start with check-. Of the rest,
  # only system:serviceaccount:check-NAME:check-NAME, which is how generate
  # installs the NAME check, can write Pods. A check that runs under another
  # account needs a policy of its own. If that policy reads params, its
  # binding needs parameterNotFoundAction: Allow, for the reason given at
  # this policy's binding.
  matchConditions:
    - name: check-accounts
      expression: >-
        request.userInfo.username.startsWith("system:serviceaccount:") &&
        request.userInfo.username.split(":").exists(part, part.startsWith("check-"))
  variables:
    - name: user
      expression: request.userInfo.username.split(":")
    - name: check
      expression: >-
        size(variables.user) == 4 && variables.user[2] == variables.user[3] &&
        variables.user[3].startsWith("check-") ? variables.user[3].substring(6) : ""
    - name: controller
      expression: '"check-" + variables.check'
    - name: owner
      expression: >-
        object != null && has(object.metadata.labels) &&
        "kube.imjasonh.github.io/controller" in object.metadata.labels ?
        object.metadata.labels["kube.imjasonh.github.io/controller"] : ""
    - name: oldOwner
      expression: >-
        oldObject != null && has(oldObject.metadata.labels) &&
        "kube.imjasonh.github.io/controller" in oldObject.metadata.labels ?
        oldObject.metadata.labels["kube.imjasonh.github.io/controller"] : ""
    - name: namespaceLabels
      expression: 'has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}'
    - name: containers
      expression: >-
        object == null ? [] :
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: securityContexts
      expression: >-
        variables.containers.map(c, has(c.securityContext), c.securityContext) +
        (object != null && has(object.spec.ephemeralContainers) ?
        object.spec.ephemeralContainers.map(c, has(c.securityContext), c.securityContext) : [])
    - name: seLinuxTypes
      expression: '["container_t", "container_init_t", "container_kvm_t", "container_engine_t"]'
    - name: handlers
      expression: >-
        variables.containers.map(c, has(c.livenessProbe), c.livenessProbe) +
        variables.containers.map(c, has(c.readinessProbe), c.readinessProbe) +
        variables.containers.map(c, has(c.startupProbe), c.startupProbe) +
        variables.containers.map(c, has(c.lifecycle) && has(c.lifecycle.postStart), c.lifecycle.postStart) +
        variables.containers.map(c, has(c.lifecycle) && has(c.lifecycle.preStop), c.lifecycle.preStop)
  validations:
    - expression: variables.check != ""
      messageExpression: request.userInfo.username + " isn't a check's service account, so it can't write Pods"
    - expression: request.namespace != "git-k8s" && !request.namespace.startsWith("check-")
      messageExpression: >-
        "the " + variables.check + " check can't change Pods in the namespaces of git-k8s programs"
    - expression: oldObject == null || variables.oldOwner == variables.controller
      messageExpression: >-
        "the " + variables.check + " check can change or delete only its own Pods, which have the label " +
        "kube.imjasonh.github.io/controller=" + variables.controller
    - expression: object == null || variables.owner == variables.controller
      messageExpression: >-
        "the " + variables.check + " check's Pods need the label " +
        "kube.imjasonh.github.io/controller=" + variables.controller
    - expression: >-
        request.operation != "CREATE" ||
        object.metadata.name.startsWith(variables.check + "-") &&
        !object.metadata.name.substring(size(variables.check) + 1).contains("-")
      messageExpression: >-
        "the " + variables.check + " check's new Pods need a name of the form " +
        variables.check + "-ID, where ID has no hyphens"
    - expression: >-
        object == null ||
        "git-k8s.imjasonh.com/check-pods" in variables.namespaceLabels &&
        variables.namespaceLabels["git-k8s.imjasonh.com/check-pods"] == "true"
      messageExpression: >-
        "the " + variables.check + " check can't create or change Pods in namespace " + request.namespace +
        ", which doesn't have the label git-k8s.imjasonh.com/check-pods=true"
    - expression: >-
        object == null ||
        "pod-security.kubernetes.io/enforce" in variables.namespaceLabels &&
        variables.namespaceLabels["pod-security.kubernetes.io/enforce"] == "restricted" &&
        (!("pod-security.kubernetes.io/enforce-version" in variables.namespaceLabels) ||
        variables.namespaceLabels["pod-security.kubernetes.io/enforce-version"] == "latest")
      messageExpression: >-
        "the " + variables.check + " check can't create or change Pods in namespace " + request.namespace +
        ", which doesn't enforce the restricted Pod Security Standard at the latest version"
    - expression: >-
        object == null ||
        (!has(object.spec.serviceAccountName) || object.spec.serviceAccountName in ["", "default"]) &&
        (!has(object.spec.serviceAccount) || object.spec.serviceAccount in ["", "default"])
      messageExpression: >-
        "the " + variables.check + " check's Pods must run as their namespace's default service account"
    - expression: request.operation != "CREATE" || !has(object.spec.nodeName) || object.spec.nodeName == ""
      messageExpression: '"the " + variables.check + " check can''t assign its Pods to a node"'
    - expression: >-
        object == null ||
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) &&
        variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      messageExpression: >-
        "the " + variables.check + " check's Pods can't use the node's network, PID, or IPC namespace, " +
        "hostPath volumes, or host ports"
    - expression: >-
        object == null ||
        (!has(object.spec.securityContext) ||
        (!has(object.spec.securityContext.seccompProfile) ||
        object.spec.securityContext.seccompProfile.type != "Unconfined") &&
        (!has(object.spec.securityContext.windowsOptions) ||
        !has(object.spec.securityContext.windowsOptions.hostProcess) ||
        !object.spec.securityContext.windowsOptions.hostProcess)) &&
        variables.securityContexts.all(s,
        !(has(s.privileged) && s.privileged) &&
        (!has(s.capabilities) || !has(s.capabilities.add) || size(s.capabilities.add) == 0) &&
        (!has(s.procMount) || s.procMount == "Default") &&
        (!has(s.seccompProfile) || s.seccompProfile.type != "Unconfined") &&
        (!has(s.windowsOptions) || !has(s.windowsOptions.hostProcess) || !s.windowsOptions.hostProcess))
      messageExpression: >-
        "the " + variables.check + " check's containers can't be privileged, add capabilities, unmask /proc, " +
        "use the Unconfined seccomp profile, or run as host processes"
    - expression: >-
        object == null ||
        (!has(object.spec.securityContext) ||
        (!has(object.spec.securityContext.appArmorProfile) ||
        object.spec.securityContext.appArmorProfile.type != "Unconfined") &&
        (!has(object.spec.securityContext.seLinuxOptions) ||
        (!has(object.spec.securityContext.seLinuxOptions.type) ||
        object.spec.securityContext.seLinuxOptions.type in variables.seLinuxTypes) &&
        !has(object.spec.securityContext.seLinuxOptions.user) &&
        !has(object.spec.securityContext.seLinuxOptions.role)) &&
        !has(object.spec.securityContext.sysctls)) &&
        variables.securityContexts.all(s,
        (!has(s.appArmorProfile) || s.appArmorProfile.type != "Unconfined") &&
        (!has(s.seLinuxOptions) ||
        (!has(s.seLinuxOptions.type) || s.seLinuxOptions.type in variables.seLinuxTypes) &&
        !has(s.seLinuxOptions.user) && !has(s.seLinuxOptions.role)))
      messageExpression: >-
        "the " + variables.check + " check's containers can't turn off AppArmor or SELinux confinement, " +
        "or set sysctls"
    - expression: >-
        variables.handlers.all(h,
        (!has(h.httpGet) || !has(h.httpGet.host) || h.httpGet.host == "") &&
        (!has(h.tcpSocket) || !has(h.tcpSocket.host) || h.tcpSocket.host == ""))
      messageExpression: '"the " + variables.check + " check''s probes and lifecycle handlers can''t set a host"'
---
# The API server looks up a binding's params before it evaluates
# matchConditions. If this binding names params with
# parameterNotFoundAction: Deny, every Pod write in the cluster fails while
# they're missing.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-check-pods
spec:
  policyName: git-k8s-check-pods
  validationActions: [Deny]
---
# Only a user with the approve verb on a GitBranch can set, change, or
# remove its approve or approved-by annotation, and generate grants that
# verb to no program. A new approve value must be a commit's full SHA,
# because anyone who can push can make a commit whose SHA starts with a
# shorter prefix. The request that sets or changes approve must set
# approved-by to the username that sends it, and the request that removes
# approve must remove approved-by, so approved-by names whoever approved.
# A request that changes only approved-by takes over the approval, so
# approve must name a commit, and the request must set approved-by to the
# username that sends it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-k8s-approvals
  annotations:
    git-k8s.imjasonh.com/policy-version: "4"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["git-k8s.imjasonh.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["gitbranches"]
  variables:
    - name: annotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: oldAnnotations
      expression: 'oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}'
    - name: approval
      expression: >-
        "git-k8s.imjasonh.com/approve" in variables.annotations ?
        variables.annotations["git-k8s.imjasonh.com/approve"] : ""
    - name: oldApproval
      expression: >-
        "git-k8s.imjasonh.com/approve" in variables.oldAnnotations ?
        variables.oldAnnotations["git-k8s.imjasonh.com/approve"] : ""
    - name: approver
      expression: >-
        "git-k8s.imjasonh.com/approved-by" in variables.annotations ?
        variables.annotations["git-k8s.imjasonh.com/approved-by"] : ""
    - name: oldApprover
      expression: >-
        "git-k8s.imjasonh.com/approved-by" in variables.oldAnnotations ?
        variables.oldAnnotations["git-k8s.imjasonh.com/approved-by"] : ""
  validations:
    - expression: >-
        (variables.approval == variables.oldApproval && variables.approver == variables.oldApprover) ||
        authorizer.group("git-k8s.imjasonh.com").resource("gitbranches").namespace(request.namespace).name(request.name).check("approve").allowed()
      reason: Forbidden
      messageExpression: >-
        "changing git-k8s.imjasonh.com/approve or git-k8s.imjasonh.com/approved-by requires the approve verb on gitbranches, which " +
        request.userInfo.username + " doesn't have for " + request.namespace + "/" + request.name
    - expression: >-
        variables.approval == variables.oldApproval || variables.approval == "" ||
        variables.approval.matches('^([0-9a-f]{40}|[0-9a-f]{64})$')
      message: set git-k8s.imjasonh.com/approve to a commit's full SHA, in lowercase hexadecimal
    - expression: >-
        variables.approval == variables.oldApproval || variables.approval == "" ||
        variables.approver == request.userInfo.username
      messageExpression: >-
        "set git-k8s.imjasonh.com/approved-by to " + request.userInfo.username +
        " when you set git-k8s.imjasonh.com/approve"
    - expression: variables.approval == variables.oldApproval || variables.approval != "" || variables.approver == ""
      message: remove git-k8s.imjasonh.com/approved-by when you remove git-k8s.imjasonh.com/approve
    - expression: >-
        variables.approval != variables.oldApproval || variables.approver == variables.oldApprover ||
        (variables.approval != "" && variables.approver == request.userInfo.username)
      messageExpression: >-
        variables.approval == "" ?
        "set git-k8s.imjasonh.com/approve when you set git-k8s.imjasonh.com/approved-by" :
        "git-k8s.imjasonh.com/approved-by can change by itself only when you take over an approval by setting it to " +
        request.userInfo.username
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: git-k8s-approvals
spec:
  policyName: git-k8s-approvals
  validationActions: [Deny]
