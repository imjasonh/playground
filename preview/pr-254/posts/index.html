<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posts · Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  color-scheme: light dark;
  --font-text: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-ui: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --bg: #f7f5f0;
  --ink: #1b1a17;
  --muted: #5a564e;
  --rule: #e4e0d8;
  --link: #1d4ed8;
  --link-hover: #1e3a8a;
  --code-bg: #ece8e0;
  --quote: #3f3c36;
  --alert-bg: #efebe3;
  --alert-border: #c9c3b6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1916;
    --ink: #f2efe8;
    --muted: #b7b1a6;
    --rule: #3a3731;
    --link: #93c5fd;
    --link-hover: #bfdbfe;
    --code-bg: #26231e;
    --quote: #d8d2c6;
    --alert-bg: #24211c;
    --alert-border: #4a453c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-text);
  font-optical-sizing: auto;
  font-size: clamp(1.125rem, 0.98rem + 0.55vw, 1.25rem);
  font-weight: 400;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
}
main {
  width: min(42rem, 100%);
  margin: 0 auto;
  padding: clamp(2.25rem, 7vw, 5rem) clamp(1.25rem, 5vw, 2.25rem) 5rem;
}
a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.16em;
}
a:hover { color: var(--link-hover); }
a:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 3px;
}
.crumbs {
  font-family: var(--font-ui);
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
  margin: 0 0 2.75rem;
}
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--link); }
h1 {
  font-family: var(--font-text);
  font-optical-sizing: auto;
  font-size: clamp(2rem, 1.4rem + 2.4vw, 2.85rem);
  font-weight: 600;
  letter-spacing: -0.018em;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0 0 0.65rem;
}
.meta {
  margin: 0.85rem 0 0;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  letter-spacing: 0;
  color: var(--muted);
}

  .posts {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .posts li { margin: 0; }
  .posts li + li { border-top: 1px solid var(--rule); }
  .posts a {
    display: block;
    padding: 1.35rem 0;
    color: inherit;
    text-decoration: none;
  }
  .posts a:hover .title { color: var(--link); }
  .posts .title {
    display: block;
    font-size: 1.35em;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    text-wrap: balance;
  }
  .posts .meta {
    display: block;
    margin-top: 0.4rem;
  }
  .empty { color: var(--muted); }
</style>
</head><body>
<main>
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="../">Playground</a>
    · Posts
  </nav>
  <h1>Posts</h1>
  <ol class="posts">
    <li>
      <a href="pasta/">
        <span class="title"><code>pasta</code></span>
        <span class="meta">August 19, 2026</span>
      </a>
    </li>
    <li>
      <a href="its-not-jaws/">
        <span class="title">It's Not Jaws</span>
        <span class="meta">August 7, 2026</span>
      </a>
    </li>
  </ol>
</main>
</body></html>
