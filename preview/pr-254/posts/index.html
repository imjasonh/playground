<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posts · Playground</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4efe6;
    --ink: #241d16;
    --muted: #6b6258;
    --rule: #d7cfc3;
    --accent: #6b3a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161310;
      --ink: #efe7db;
      --muted: #b3a897;
      --rule: #3a342c;
      --accent: #e0b59a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 4.5rem) clamp(1.1rem, 4vw, 2rem) 4rem;
  }
  .crumbs {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: .8rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2rem;
  }
  .crumbs a { color: var(--accent); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  h1 {
    font-size: clamp(2.2rem, 7vw, 3.1rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 .6rem;
  }
  .lede {
    margin: 0 0 2.2rem;
    color: var(--muted);
    font-size: 1.15rem;
    font-style: italic;
  }
  .posts {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }
  .posts li { margin: 0; }
  .posts a {
    display: block;
    padding: 1.15rem 0;
    border-bottom: 1px solid var(--rule);
    color: inherit;
    text-decoration: none;
  }
  .posts a:hover .title { color: var(--accent); }
  .posts .title {
    display: block;
    font-size: 1.35rem;
    line-height: 1.25;
  }
  .posts .meta {
    display: block;
    margin-top: .35rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: .8rem;
    letter-spacing: .03em;
    color: var(--muted);
  }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head><body>
<main>
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="../">Playground</a>
    · Posts
  </nav>
  <h1>Posts</h1>
  <p class="lede">Newest first.</p>
  <ol class="posts">
    <li>
      <a href="pasta/">
        <span class="title"><code>pasta</code></span>
        <span class="meta">August 19, 2026</span>
      </a>
    </li>
    <li>
      <a href="its-not-jaws/">
        <span class="title">It's Not Jaws</span>
        <span class="meta">August 7, 2026</span>
      </a>
    </li>
  </ol>
</main>
</body></html>
