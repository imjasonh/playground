<!doctype html>
<meta charset="utf-8" />
<title>reflection probe</title>
<pre id="out">running</pre>
<script type="module">
  import { HeliAudio } from '/src/audio.js';
  import { BUILDINGS, helicopterPath } from '/src/city.js';
  import { occlusionAmount } from '/src/occlusion.js';
  import { computeReflections } from '/src/reflections.js';
  import { forwardVector, upVector } from '/src/geometry.js';

  const audio = new HeliAudio();
  await audio.resume();
  audio.fadeIn();

  // Stand in the avenue looking north; heli passes where facades should bounce.
  const listener = [0, 1.7, 0];
  const forward = forwardVector(0);
  const up = upVector();

  function sampleAt(t, reflectionsEnabled) {
    const source = helicopterPath(t);
    const occ = occlusionAmount(listener, source, BUILDINGS);
    const reflections = computeReflections(listener, source, BUILDINGS, {
      limit: 12,
      maxOrder: 2,
    });
    audio.setReflectionsEnabled(reflectionsEnabled);
    audio.setOcclusionEnabled(true);
    audio.setReverbEnabled(false);
    audio.update(source, listener, forward, up, {
      occlusion: occ,
      reflections,
      enclosure: { amount: 0, rt60Sec: 0.3 },
    });
    return { source, occ, reflections, levels: null };
  }

  // Warm the graph, then average ear energy with wet on vs off over one orbit.
  const onSamples = [];
  const offSamples = [];
  let maxTaps = 0;
  let maxOrder2 = 0;
  let occludedFrames = 0;

  for (let phase = 0; phase < 2; phase++) {
    const wet = phase === 0;
    const bucket = wet ? onSamples : offSamples;
    const start = performance.now();
    await new Promise((resolve) => {
      function tick() {
        const t = (performance.now() - start) / 1000;
        const snap = sampleAt(t, wet);
        maxTaps = Math.max(maxTaps, snap.reflections.length);
        maxOrder2 = Math.max(
          maxOrder2,
          snap.reflections.filter((r) => r.order === 2).length,
        );
        if (snap.occ > 0) occludedFrames++;
        // Let the audio ramp settle a few frames before measuring.
        if (t > 0.4) {
          const levels = audio.earLevels();
          if (levels.left + levels.right > 0.0005) {
            bucket.push(levels.left + levels.right);
          }
        }
        if (t < 10.5) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / Math.max(arr.length, 1);
  const onAvg = avg(onSamples);
  const offAvg = avg(offSamples);
  // Reflections should add measurable energy on average across the orbit.
  const energyPass = onSamples.length > 50 && offSamples.length > 50 && onAvg > offAvg * 1.05;
  const tapsPass = maxTaps >= 1;
  const order2Pass = maxOrder2 >= 1;
  // Occlusion should engage at some point in the elongated path.
  const occPass = occludedFrames > 0;

  const verdict = {
    pass: energyPass && tapsPass && order2Pass,
    energyPass,
    tapsPass,
    order2Pass,
    occPass,
    maxTaps,
    maxOrder2,
    occludedFrames,
    avgEnergyReflectionsOn: onAvg,
    avgEnergyReflectionsOff: offAvg,
    ratio: offAvg > 0 ? onAvg / offAvg : null,
    contextState: audio.earLevels().contextState,
  };
  document.getElementById('out').textContent = ['REFLECTION_PROBE', JSON.stringify(verdict)].join(
    '=',
  );
</script>
