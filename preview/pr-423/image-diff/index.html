<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ece7dc" />
    <meta
      name="description"
      content="Compare two images in the browser. Matching pixels stay as they are; the more a pixel differs, the more red it is tinted. Files never leave your machine."
    />
    <title>Image diff</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <h1>Image diff</h1>
      </header>

      <section class="sources" aria-label="Source images">
        <article class="slot">
          <h2>Image A</h2>
          <div
            class="drop"
            data-slot="a"
            role="button"
            tabindex="0"
            aria-label="Image A. Drop a file or click to choose."
          >
            <input type="file" accept="image/*" hidden />
            <div class="preview" hidden>
              <img alt="" />
              <div class="crop" hidden></div>
            </div>
          </div>
          <p class="slot-meta" hidden></p>
        </article>

        <article class="slot">
          <h2>Image B</h2>
          <div
            class="drop"
            data-slot="b"
            role="button"
            tabindex="0"
            aria-label="Image B. Drop a file or click to choose."
          >
            <input type="file" accept="image/*" hidden />
            <div class="preview" hidden>
              <img alt="" />
              <div class="crop" hidden></div>
            </div>
          </div>
          <p class="slot-meta" hidden></p>
        </article>
      </section>

      <section class="result" id="result" aria-label="Diff">
        <h2>Diff</h2>
        <div class="result-frame">
          <p class="result-empty" id="result-empty">Drop two images to compare</p>
          <canvas id="diff-canvas" hidden></canvas>
        </div>
        <p class="result-status" id="result-status" role="status"></p>
      </section>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
