<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; font-src https: data:; img-src * data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16171b" />
    <meta
      name="description"
      content="Present a Marp deck with its speaker notes read aloud by your browser, with subtitles."
    />
    <title>Marptalk</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="modulepreload" href="vendor/marp.js" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>Marptalk</h1>
      <div class="picker">
        <label class="visually-hidden" for="deck">Deck</label>
        <select id="deck"></select>
        <a class="ghost" id="source" rel="noopener" hidden>Source</a>
        <button type="button" class="ghost" id="open">Open .md</button>
        <input
          type="file"
          id="file"
          accept=".md,.markdown,text/markdown,text/plain"
          hidden
        />
      </div>
    </header>

    <main class="layout">
      <section class="stage" id="stage" aria-label="Slides">
        <div class="viewport" id="viewport">
          <div class="screen" id="screen"></div>
          <p class="caption" id="caption" hidden></p>
          <p class="status" id="status" role="status"></p>
        </div>

        <div class="controls" id="controls">
          <button type="button" class="icon" id="prev" aria-label="Previous slide">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <button
            type="button"
            class="icon play"
            id="play"
            aria-label="Play"
            aria-keyshortcuts="Space"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" class="when-paused">
              <path d="M8 5v14l11-7z" class="fill" />
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="when-playing">
              <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" class="fill" />
            </svg>
          </button>
          <button type="button" class="icon" id="next" aria-label="Next slide">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>
          <span class="counter" id="counter" aria-live="polite">0 / 0</span>

          <div class="progress" id="progress" role="group" aria-label="Go to slide"></div>

          <label class="visually-hidden" for="speed">Speed</label>
          <select id="speed" aria-keyshortcuts="Shift+Comma Shift+Period">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1">1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <label class="visually-hidden" for="voice">Voice</label>
          <select id="voice" class="voice"></select>
          <button
            type="button"
            class="icon"
            id="captions"
            aria-label="Subtitles"
            aria-pressed="true"
            aria-keyshortcuts="C"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6" />
            </svg>
          </button>
          <button
            type="button"
            class="icon"
            id="mute"
            aria-label="Mute voice"
            aria-pressed="false"
            aria-keyshortcuts="M"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" class="fill" />
              <path d="M16.5 8.5a5 5 0 0 1 0 7" class="when-unmuted" />
              <path d="M16 9l5 6M21 9l-5 6" class="when-muted" />
            </svg>
          </button>
          <button
            type="button"
            class="icon"
            id="fullscreen"
            aria-label="Full screen"
            aria-keyshortcuts="F"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
            </svg>
          </button>
        </div>
        <div class="drop" id="drop" hidden>Drop a Marp .md file</div>
      </section>

      <section class="script" aria-labelledby="script-title">
        <div class="script-head">
          <h2 id="script-title">Voiceover</h2>
          <p class="meta" id="meta"></p>
        </div>
        <ol class="cues" id="cues"></ol>
        <p class="empty" id="no-cues" hidden>This slide has no voiceover.</p>
      </section>
    </main>
    <script src="whbiab.js" data-app="marptalk"></script>
  </body>
</html>
