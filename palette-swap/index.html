<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Palette swap</h1>
    <p class="intro">Each pixel is replaced by the nearest color in a fixed palette. One Wasm binary runs that mapping as ordinary Go, as the portable simd package, and as Wasm archsimd.</p>
    <div class="controls">
      <label>Image
        <input id="file" type="file" accept="image/*" disabled>
      </label>
      <label>Palette
        <select id="palette" disabled></select>
      </label>
      <button id="bench" type="button" disabled>Benchmark</button>
    </div>
    <div id="swatches" class="swatches" aria-hidden="true"></div>
    <p id="status" aria-live="polite">Loading Wasm.</p>
    <div id="times"></div>
    <div id="results" class="results" hidden>
      <figure>
        <figcaption>Source</figcaption>
        <canvas id="source"></canvas>
      </figure>
      <figure data-method="scalar">
        <figcaption>Scalar</figcaption>
        <canvas id="scalar"></canvas>
      </figure>
      <figure data-method="portable">
        <figcaption>Portable SIMD</figcaption>
        <canvas id="portable"></canvas>
      </figure>
      <figure data-method="arch">
        <figcaption>Wasm archsimd</figcaption>
        <canvas id="arch"></canvas>
      </figure>
    </div>
  </main>
  <script src="wasm/wasm_exec.js"></script>
  <script src="app.js"></script>
</body>
</html>
