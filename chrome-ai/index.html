<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f1ea" />
    <meta
      name="description"
      content="Chat with the language model built into Chrome. Prompts and replies stay on your device."
    />
    <title>Chrome AI</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <h1>Chrome AI</h1>
        <button type="button" class="ghost" id="new-chat" disabled>
          New chat
        </button>
      </header>

      <main class="log" id="log">
        <p class="empty" id="empty">Ask the on-device model anything</p>
        <ol class="messages" id="messages" aria-live="polite"></ol>
      </main>

      <footer class="dock">
        <p class="status" id="status" role="status"></p>
        <button type="button" class="primary" id="download" hidden>
          Download model
        </button>
        <form class="composer" id="composer">
          <label class="visually-hidden" for="prompt">Message</label>
          <textarea
            id="prompt"
            rows="1"
            placeholder="Message"
            autocomplete="off"
            disabled
          ></textarea>
          <button type="submit" class="primary" id="send" disabled>Send</button>
          <button type="button" class="primary" id="stop" hidden>Stop</button>
        </form>
      </footer>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
