[package]
name = "y-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-user microblog for Cloudflare Workers (D1 + R2)"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Dependencies that build on every target (native + wasm). Auth, HTML, and
# WebAuthn verification are pure Rust so native `cargo test` exercises the
# same code the Worker runs.
[dependencies]
# The SIMD engines (default `simd-unsafe` feature) do nothing on wasm32.
base64 = { version = "0.23", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

# The Cloudflare Workers runtime bindings are wasm-only. Gating them to the
# wasm32 target keeps native `cargo test` free of the JS/wasm-bindgen glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1"] }
# getrandom reaches crypto.getRandomValues through wasm-bindgen.
getrandom = { version = "0.4", features = ["wasm_js"] }

# Tests generate throwaway signing keys.
[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "getrandom"] }

[[example]]
name = "hash-password"
path = "examples/hash_password.rs"

[profile.release]
opt-level = "s"
lto = true
# wasm-bindgen needs the wasm `target_features` custom section. `strip = true`
# drops that section (workers-rs#1014).
strip = "debuginfo"

[lints.rust]
unused = "deny"
