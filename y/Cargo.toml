[package]
name = "y-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-user microblog for Cloudflare Workers (D1 + R2)"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Dependencies that build on every target (native + wasm). Auth, HTML, and
# WebAuthn verification are pure Rust so native `cargo test` exercises the
# same code the Worker runs.
[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

# The Cloudflare Workers runtime bindings are wasm-only. Gating them to the
# wasm32 target keeps native `cargo test` free of the JS/wasm-bindgen glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.125"

[[example]]
name = "hash-password"
path = "examples/hash_password.rs"

[profile.release]
opt-level = "s"
lto = true
# worker-build 0.8.5 + wasm-bindgen 0.2.125 need the wasm `target_features`
# custom section. `strip = true` drops that section (workers-rs#1014).
strip = "debuginfo"

[lints.rust]
unused = "deny"
