# Cloudflare Workers configuration for y — one-user microblog.
#
# This project has no index.html, so the GitHub Pages workflows skip it; it is
# deployed to Cloudflare by `deploy-workers.yml` on pushes to `main` (using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets). Worker name `y`
# matches the already-deployed script on the same account. The D1 database id
# and R2 bucket below are the production bindings; deploy applies D1 migrations
# and creates the R2 bucket if it is missing.

name = "y"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Default vars; override per-env as needed.
[vars]
SITE_TITLE = "y"
SITE_URL = "https://y.imjasonh.workers.dev"

# D1 — create with: wrangler d1 create y
[[d1_databases]]
binding = "DB"
database_name = "y"
database_id = "02a36e09-dbee-43fa-aaf3-6dc9c0bbbdfe"
migrations_dir = "migrations"

# R2 — create with: wrangler r2 bucket create y-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "y-images"

# Secrets to set with `wrangler secret put`:
#   ADMIN_PASSWORD_HASH   (scrypt-style hash, see src/auth.ts)
#   SESSION_SECRET        (random 32+ byte hex)
