# Cloudflare Workers configuration for y — one-user microblog.
#
# This project has no index.html, so the GitHub Pages workflows skip it; it is
# deployed to Cloudflare by `deploy-workers.yml` on pushes to `main` (using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets). Worker name `y`
# matches the already-deployed script on the same account. The D1 database id
# and R2 bucket below are the production bindings; deploy applies D1 migrations
# and creates the R2 bucket if it is missing.

name = "y"
main = "build/worker/shim.mjs"
compatibility_date = "2025-04-01"

# Build the wasm Worker from Rust. `worker-build` wraps `cargo build
# --target wasm32-unknown-unknown` and emits the JS shim referenced by `main`.
#
# worker-build is major-version-locked with `worker` (0.8.x ↔ 0.8.x) and bundles
# wasm-bindgen CLI 0.2.125, which must match the library pin in Cargo.toml.
# Build the *tool* with stable — its deps need a recent Cargo — while
# worker-build compiles this crate with rust-toolchain.toml.
[build]
command = "cargo +stable install -q worker-build@0.8.5 && worker-build --release"

# Default vars; override per-env as needed.
[vars]
SITE_TITLE = "y"
SITE_URL = "https://y.imjasonh.workers.dev"
# Verified Cloudflare Email Sending from-address. Empty disables outbound mail
# (posts still wait one minute, then the cron no-ops). Cannot send from
# *.workers.dev — use a domain with SPF/DKIM on this account.
MAIL_FROM = ""

# D1 — create with: wrangler d1 create y
[[d1_databases]]
binding = "DB"
database_name = "y"
database_id = "02a36e09-dbee-43fa-aaf3-6dc9c0bbbdfe"
migrations_dir = "migrations"

# R2 — create with: wrangler r2 bucket create y-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "y-images"

# Outbound post notifications. Local `wrangler dev` logs mail instead of sending.
[[send_email]]
name = "EMAIL"

# Fan out mail once a post's 1-minute undo window has passed.
[triggers]
crons = ["* * * * *"]

# Secrets to set with `wrangler secret put`:
#   ADMIN_PASSWORD_HASH   (pbkdf2$iters$saltHex$hashHex, see examples/hash_password.rs)
#   SESSION_SECRET        (random 32+ byte hex)
