[package]
name = "memo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Run a command, record what it read, and replay its output until those inputs change"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[[bin]]
name = "memo"
path = "src/main.rs"

[dependencies]
blake3 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused = "deny"
