[package]
name = "inkbot-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "E-ink frame image host + Slack app for Cloudflare Workers"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Dependencies that build on every target (native + wasm). Keeping image
# transform, auth, and Slack event parsing here means native `cargo test`
# exercises the same code the Worker runs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
# Decode Slack attachments (png/jpeg/gif/webp) and encode the panel PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Direct 1-bit PNG encode so the ESP32 gets a compact, packable frame.
png = "0.18"

# The Cloudflare Workers runtime bindings are wasm-only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
futures = "0.3"

# `examples/gensecret.rs` (run natively by the deploy workflow) reads the OS RNG.
[dev-dependencies]
getrandom = "0.4"

[profile.release]
opt-level = "s"
lto = true
# wasm-bindgen needs the wasm `target_features` custom section. `strip = true`
# drops that section (workers-rs#1014).
strip = "debuginfo"

[lints.rust]
unused = "deny"
