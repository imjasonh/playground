# Cloudflare Workers configuration for inkbot — e-ink frame image host + Slack app.
#
# This project has no index.html, so the GitHub Pages workflows skip it; it is
# deployed to Cloudflare by `deploy-workers.yml` on pushes to `main` (using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets). The deploy
# creates the R2 bucket below if it doesn't exist, and get-or-generates the
# UPLOAD_SECRET Worker secret when unset.

name = "inkbot"
main = "build/worker/shim.mjs"
compatibility_date = "2024-11-01"

# Build the wasm Worker from Rust. `worker-build` wraps `cargo build
# --target wasm32-unknown-unknown` and emits the JS shim referenced by `main`.
#
# worker-build is major-version-locked with `worker` (0.8.x ↔ 0.8.x) and bundles
# wasm-bindgen CLI 0.2.125, which must match the library pin in Cargo.toml.
[build]
command = "cargo +stable install -q worker-build@0.8.5 && worker-build --release"

# Current frame PNG lives here as a single object (`image.png`).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "inkbot-images"

# Public, non-secret configuration.
#
# PANEL_WIDTH / PANEL_HEIGHT: expected e-ink panel size (Waveshare 7.5" V2).
[vars]
PANEL_WIDTH = "800"
PANEL_HEIGHT = "480"

# Secrets (set out of band; never commit):
#   UPLOAD_SECRET        — Bearer token for POST /image.png
#                          (auto-generated on deploy if unset; see ensure script)
#   SLACK_BOT_TOKEN      — xoxb-… bot token (Slack features disabled if unset)
#   SLACK_SIGNING_SECRET — Events API request signature secret
