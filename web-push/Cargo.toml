[package]
name = "web-push-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Web Push (RFC 8030/8188/8291/8292) application-server backend for Cloudflare Workers, written in Rust"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Dependencies that build on every target (native + wasm). All crypto is
# pure-Rust (RustCrypto) so the exact same code path is exercised by native
# `cargo test` and by the wasm32 Worker build.
[dependencies]
# The SIMD engines (default `simd-unsafe` feature) do nothing on wasm32.
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hkdf = "0.13"
# RFC 8188 derives each nonce with HKDF, so aead's RNG helpers (the default
# `getrandom` feature) go unused.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Only the raw-byte ECDSA/ECDH APIs are used (no PEM/PKCS8), so default
# features are disabled to avoid the der/base64ct dependency chain.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "getrandom"] }
# Random salts; p256's `getrandom` feature generates the ephemeral keys.
getrandom = "0.4"
async-trait = "0.1"

# The Cloudflare Workers runtime bindings are wasm-only. Gating them to the
# wasm32 target keeps native `cargo test` free of the JS/wasm-bindgen glue, so
# all business logic stays testable on the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
# getrandom reaches crypto.getRandomValues through wasm-bindgen.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
# wasm-bindgen needs the wasm `target_features` custom section (for
# `reference-types` / externref catch wrappers). `strip = true` (= "symbols")
# drops that section and fails bindgen with "externref table required for
# catch wrappers" (workers-rs#1014).
strip = "debuginfo"

[lints.rust]
unused = "deny"
