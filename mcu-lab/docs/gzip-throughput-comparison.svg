<text x="222" y="271" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
<rect x="230" y="260" width="199.2" height="14" fill="#428bca" rx="2"/>
<text x="435.2" y="271" class="val">5.61 MB/s</text>
