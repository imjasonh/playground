<rect x="230" y="124" width="573.0" height="14" fill="#5cb85c" rx="2"/>
<text x="809.0" y="135" class="val">16.14 MB/s</text>
<text x="24" y="165" class="gtitle">Inflate: json_otel (4 KiB, 7.0x)</text>
<text x="222" y="184" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
