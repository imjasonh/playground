<svg xmlns="http://www.w3.org/2000/svg" width="980" height="515" viewBox="0 0 980 515">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  .title { font-size: 16px; font-weight: 700; fill: #1a1f2c; }
  .sub { font-size: 11.5px; fill: #556070; }
  .gtitle { font-size: 12px; font-weight: 700; fill: #1a1f2c; }
  .lbl { font-size: 11px; fill: #334155; }
  .val { font-size: 11px; font-weight: 600; fill: #1e293b; }
</style>
<rect width="980" height="515" fill="#fafbfc" rx="8"/>
<text x="24" y="28" class="title">ESP32 Mask-ROM (240 MHz) vs. ESP32-C3 miniz_oxide (160 MHz)</text>
<text x="24" y="46" class="sub">Measured USB-C throughput (MB/s) — higher is better</text>
<line x1="230.0" y1="60" x2="230.0" y2="491" stroke="#e2e8f0" stroke-width="1"/>
<text x="230.0" y="507" text-anchor="middle" class="sub">0 MB/s</text>
<line x1="407.5" y1="60" x2="407.5" y2="491" stroke="#e2e8f0" stroke-width="1"/>
<text x="407.5" y="507" text-anchor="middle" class="sub">5 MB/s</text>
<line x1="585.0" y1="60" x2="585.0" y2="491" stroke="#e2e8f0" stroke-width="1"/>
<text x="585.0" y="507" text-anchor="middle" class="sub">10 MB/s</text>
<line x1="762.5" y1="60" x2="762.5" y2="491" stroke="#e2e8f0" stroke-width="1"/>
<text x="762.5" y="507" text-anchor="middle" class="sub">15 MB/s</text>
<line x1="940.0" y1="60" x2="940.0" y2="491" stroke="#e2e8f0" stroke-width="1"/>
<text x="940.0" y="507" text-anchor="middle" class="sub">20 MB/s</text>
<text x="24" y="78" class="gtitle">Inflate: rle_epd (8 KiB, 65.5x)</text>
<text x="222" y="97" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
<rect x="230" y="86" width="637.2" height="14" fill="#428bca" rx="2"/>
<text x="873.2" y="97" class="val">17.95 MB/s</text>
<text x="222" y="116" text-anchor="end" class="lbl">ESP32-C3 miniz_oxide (160 MHz)</text>
<rect x="230" y="105" width="415.7" height="14" fill="#f0ad4e" rx="2"/>
<text x="651.7" y="116" class="val">11.71 MB/s</text>
