<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  .title { font-size: 16px; font-weight: 700; fill: #1a1f2c; }
  .sub { font-size: 11.5px; fill: #556070; }
  .gtitle { font-size: 12px; font-weight: 700; fill: #1a1f2c; }
  .lbl { font-size: 11px; fill: #334155; }
  .val { font-size: 11px; font-weight: 600; fill: #1e293b; }
</style>
<rect width="980" height="420" fill="#fafbfc" rx="8"/>
<text x="24" y="28" class="title">ESP32 Mask-ROM (240 MHz) vs. ESP32-C3 miniz_oxide (160 MHz)</text>
<text x="24" y="46" class="sub">Measured USB-C throughput (MB/s) — higher is better</text>
<line x1="220.0" y1="60" x2="220.0" y2="396" stroke="#e2e8f0" stroke-width="1"/>
<text x="220.0" y="412" text-anchor="middle" class="sub">0 MB/s</text>
<line x1="400.0" y1="60" x2="400.0" y2="396" stroke="#e2e8f0" stroke-width="1"/>
<text x="400.0" y="412" text-anchor="middle" class="sub">5 MB/s</text>
<line x1="580.0" y1="60" x2="580.0" y2="396" stroke="#e2e8f0" stroke-width="1"/>
<text x="580.0" y="412" text-anchor="middle" class="sub">10 MB/s</text>
<line x1="760.0" y1="60" x2="760.0" y2="396" stroke="#e2e8f0" stroke-width="1"/>
<text x="760.0" y="412" text-anchor="middle" class="sub">15 MB/s</text>
<line x1="940.0" y1="60" x2="940.0" y2="396" stroke="#e2e8f0" stroke-width="1"/>
<text x="940.0" y="412" text-anchor="middle" class="sub">20 MB/s</text>
<text x="24" y="78" class="gtitle">Inflate: rle_epd (8 KiB, 65.5x)</text>
<text x="212" y="79" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
<rect x="220" y="68" width="646.2" height="14" fill="#428bca" rx="2"/>
<text x="872.2" y="79" class="val">17.95 MB/s</text>
<text x="212" y="98" text-anchor="end" class="lbl">ESP32-C3 miniz_oxide (160 MHz)</text>
<rect x="220" y="87" width="421.6" height="14" fill="#f0ad4e" rx="2"/>
<text x="647.6" y="98" class="val">11.71 MB/s</text>
<text x="212" y="117" text-anchor="end" class="lbl">ESP32-C3 patched miniz_oxide</text>
<rect x="220" y="106" width="581.0" height="14" fill="#5cb85c" rx="2"/>
<text x="807.0" y="117" class="val">16.14 MB/s</text>
<text x="24" y="147" class="gtitle">Inflate: json_otel (4 KiB, 7.0x)</text>
<text x="212" y="148" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
<rect x="220" y="137" width="259.6" height="14" fill="#428bca" rx="2"/>
<text x="485.6" y="148" class="val">7.21 MB/s</text>
<text x="212" y="167" text-anchor="end" class="lbl">ESP32-C3 miniz_oxide (160 MHz)</text>
<rect x="220" y="156" width="181.8" height="14" fill="#f0ad4e" rx="2"/>
<text x="407.8" y="167" class="val">5.05 MB/s</text>
<text x="212" y="186" text-anchor="end" class="lbl">ESP32-C3 patched miniz_oxide</text>
<rect x="220" y="175" width="195.5" height="14" fill="#5cb85c" rx="2"/>
<text x="421.5" y="186" class="val">5.43 MB/s</text>
<text x="24" y="216" class="gtitle">Inflate: code_ascii (4 KiB, 3.9x)</text>
<text x="212" y="217" text-anchor="end" class="lbl">ESP32 Mask-ROM (240 MHz)</text>
<rect x="220" y="206" width="202.0" height="14" fill="#428bca" rx="2"/>
<text x="428.0" y="217" class="val">5.61 MB/s</text>
<text x="212" y="236" text-anchor="end" class="lbl">ESP32-C3 miniz_oxide (160 MHz)</text>
<rect x="220" y="225" width="143.3" height="14" fill="#f0ad4e" rx="2"/>
<text x="369.3" y="236" class="val">3.98 MB/s</text>
<text x="212" y="255" text-anchor="end" class="lbl">ESP32-C3 patched miniz_oxide</text>
<rect x="220" y="244" width="149.8" height="14" fill="#5cb85c" rx="2"/>
<text x="375.8" y="255" class="val">4.16 MB/s</text>
<text x="24" y="285" class="gtitle">Deflate: json_otel (4 KiB, fast)</text>
<text x="212" y="286" text-anchor="end" class="lbl">ESP32 Mask-ROM p1 (240 MHz)</text>
<rect x="220" y="275" width="67.0" height="14" fill="#428bca" rx="2"/>
<text x="293.0" y="286" class="val">1.86 MB/s</text>
<text x="212" y="305" text-anchor="end" class="lbl">ESP32-C3 miniz_oxide (stock)</text>
<text x="224" y="305" class="val" fill="#d9534f">OOM (~308 KiB)</text>
<text x="212" y="324" text-anchor="end" class="lbl">ESP32-C3 patched l1 (160 MHz)</text>
<rect x="220" y="313" width="76.0" height="14" fill="#5cb85c" rx="2"/>
<text x="302.0" y="324" class="val">2.11 MB/s</text>
<text x="24" y="354" class="gtitle">CRC32 (8 KiB)</text>
<text x="212" y="355" text-anchor="end" class="lbl">ESP32 Mask-ROM mz_crc32</text>
<rect x="220" y="344" width="377.6" height="14" fill="#428bca" rx="2"/>
<text x="603.6" y="355" class="val">10.49 MB/s</text>
<text x="212" y="374" text-anchor="end" class="lbl">ESP32-C3 ROM esp_rom_crc32_le</text>
<rect x="220" y="363" width="346.0" height="14" fill="#5cb85c" rx="2"/>
<text x="572.0" y="374" class="val">9.61 MB/s</text>
<text x="212" y="393" text-anchor="end" class="lbl">ESP32-C3 Rust bit-by-bit</text>
<rect x="220" y="382" width="70.9" height="14" fill="#d9534f" rx="2"/>
<text x="296.9" y="393" class="val">1.97 MB/s</text>
</svg>
