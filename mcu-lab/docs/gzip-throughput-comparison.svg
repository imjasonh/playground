<text x="383.7" y="309" class="val">4.16 MB/s</text>
<text x="24" y="339" class="gtitle">Deflate: json_otel (4 KiB, fast)</text>
<text x="222" y="358" text-anchor="end" class="lbl">ESP32 Mask-ROM p1 (240 MHz)</text>
