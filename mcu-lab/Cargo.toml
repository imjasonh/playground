[package]
name = "mcu-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Multi-MCU ESP-IDF firmware lab: shared BLE telemetry, BLE GATT OTA, and profiling for XIAO ESP32-C3 and Waveshare 7.5\" e-Paper ESP32"
repository = "https://github.com/imjasonh/playground"
readme = "README.md"
publish = false

[lib]
name = "mcu_lab"
path = "src/lib.rs"

[[bin]]
name = "xiao-esp32c3-base"
path = "src/bin/xiao_esp32c3_base.rs"
harness = false
required-features = ["firmware"]

[[bin]]
name = "xiao-esp32c3-bench"
path = "src/bin/xiao_esp32c3_bench.rs"
harness = false
required-features = ["firmware"]

[[bin]]
name = "waveshare-epd75-base"
path = "src/bin/waveshare_epd75_base.rs"
harness = false
required-features = ["firmware"]

[[bin]]
name = "waveshare-epd75-maze"
path = "src/bin/waveshare_epd75_maze.rs"
harness = false
required-features = ["firmware"]

[features]
default = []
# Device firmware (esp-idf HAL + NimBLE). Host `cargo test` leaves this off.
firmware = []
# Enable fine-grained sub-phase spans, heap/stack/cycle telemetry, 1 kHz PC
# hotspot sampling, and the BLE GATT PROFILE_CHAR_UUID endpoint. Debug builds
# enable this automatically; production `--release --features firmware` strips
# profiling to 0 bytes / 0 µs.
profiling = []

[dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
esp-idf-svc = { version = "0.53", features = ["std", "native", "binstart"] }
esp32-nimble = "0.13"
hex = "0.4"
log = "0.4"
sha2 = "0.11"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"

[lints.rust]
unused = "deny"
