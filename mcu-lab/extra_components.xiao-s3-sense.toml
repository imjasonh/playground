# Extra ESP-IDF components enabled only for boards with a DVP camera (XIAO ESP32-S3 Sense).
# Passed via ESP_IDF_SYS_EXTRA_COMPONENTS_FILE from the Makefile so non-camera boards
# (xiao-esp32c3, waveshare-epd75) do not fetch or compile esp32-camera.
[[extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "^2.2.0" }
bindings_header = "@PROJECT_DIR@/camera_bindings.h"
bindings_module = "camera"
