[package]
name = "provision"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "provision"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unused = "deny"
