; Minimal firmware for the Waveshare e-Paper ESP32 Driver Board + 7.5" 800×480
; monochrome panel. Polls inkbot's /image.png once a minute and full-refreshes
; the panel when the ETag changes.
;
; Build / flash (needs PlatformIO):
;   cp include/config.h.example include/config.h   # WiFi + Worker URL
;   pio run -t upload
;   pio device monitor

[env:waveshare-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2 @ ^1.6.2
  bitbank2/PNGdec @ ^1.0.3
build_flags =
  -DCORE_DEBUG_LEVEL=1
