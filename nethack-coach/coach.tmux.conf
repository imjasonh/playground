# Self-contained tmux profile for nethack-coach.
#
# The launcher loads this with `tmux -L nethack-coach -f coach.tmux.conf`, so it
# runs on a private server and never touches the player's own tmux config.

set -g default-terminal "tmux-256color"
set -g mouse on

# Keep the final screen readable after NetHack or the advisor exits. The pane
# stays as a dead pane showing its last output until the session is killed.
set -g remain-on-exit on

set -g base-index 0
setw -g pane-base-index 0

# Name the panes along their top border: "NetHack" on the left, "Coach" on the right.
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour240"

# A one-line cheat sheet for the hotkeys the launcher binds.
set -g status on
set -g status-interval 2
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right "F9 ask   F10 auto-advice   F8 quit   C-b d detach"
set -g status-right-length 80
set -g status-style "bg=colour236,fg=colour252"
