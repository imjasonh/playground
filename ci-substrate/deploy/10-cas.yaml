apiVersion: apps/v1
kind: Deployment
metadata:
  name: cas
  namespace: ci-substrate
  labels: {app: cas}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cas}
  template:
    metadata:
      labels: {app: cas}
    spec:
      containers:
        - name: cas
          image: ko://github.com/imjasonh/playground/ci-substrate/cmd/cas # pasta:ignore unpinned_container_image
          env:
            - name: ADDR
              value: ":8980"
            - name: STORE_DIR
              value: /data
            - name: TENANTS
              valueFrom:
                secretKeyRef: {name: tenants, key: TENANTS}
          ports:
            - {name: grpc, containerPort: 8980}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            grpc: {port: 8980}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        # The demo origin keeps blobs on an emptyDir and the action cache in
        # memory, so both reset when the pod restarts. A production origin
        # needs durable storage and a shared action-cache database.
        - name: data
          emptyDir: {sizeLimit: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: cas
  namespace: ci-substrate
spec:
  selector: {app: cas}
  ports:
    - {name: grpc, port: 8980, targetPort: 8980}
