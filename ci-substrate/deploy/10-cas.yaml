# cas is a StatefulSet so its blobs and action cache live on a
# PersistentVolumeClaim and survive a pod restart (plan M1: durable control
# plane state). It runs one replica: the scheduler's queue is in memory, and a
# client whose operation disappears in a restart gets NotFound from
# WaitExecution and calls Execute again.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cas
  namespace: ci-substrate
  labels: {app: cas}
spec:
  serviceName: cas
  replicas: 1
  selector:
    matchLabels: {app: cas}
  template:
    metadata:
      labels: {app: cas}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: cas
          image: ko://github.com/imjasonh/playground/ci-substrate/cmd/cas # pasta:ignore unpinned_container_image
          env:
            - name: ADDR
              value: ":8980"
            - name: STORE_DIR
              value: /data
            - name: TENANTS
              valueFrom:
                secretKeyRef: {name: tenants, key: TENANTS}
          ports:
            - {name: grpc, containerPort: 8980}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            grpc: {port: 8980}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: cas
  namespace: ci-substrate
spec:
  selector: {app: cas}
  ports:
    - {name: grpc, port: 8980, targetPort: 8980}
