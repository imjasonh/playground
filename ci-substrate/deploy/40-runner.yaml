  namespace: ci-substrate
  labels: {app: runner, tenant: tenant-b}
spec:
  replicas: 1
  selector:
    matchLabels: {app: runner, tenant: tenant-b}
  template:
    metadata:
      labels: {app: runner, tenant: tenant-b}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner
          image: ko://github.com/imjasonh/playground/ci-substrate/cmd/runner # pasta:ignore unpinned_container_image
          args:
            - -origin-addr=cas.ci-substrate.svc.cluster.local:8980
            - -cache-addr=cascache.ci-substrate.svc.cluster.local:9092
            - -instances=tenant-b
            - -token=$(TENANT_TOKEN)
            - -work-dir=/work
          env:
            - name: TENANT_TOKEN
              valueFrom:
                secretKeyRef: {name: runner-token-tenant-b, key: token}
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        - name: work
          emptyDir: {sizeLimit: 10Gi}
        - name: tmp
          emptyDir: {}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
