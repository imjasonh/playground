# The node-local CAS proxy. One pod per node (DaemonSet) serving build pods on
# that node from a verified read-through cache backed by node-local disk.
# Every node gets its own warm set; a blob fetched once is reused by every
# later reader on that node. The Service below keeps traffic on the caller's
# node, so the pod needs no host network.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cascache
  namespace: ci-substrate
  labels: {app: cascache}
spec:
  selector:
    matchLabels: {app: cascache}
  template:
    metadata:
      labels: {app: cascache}
    spec:
      containers:
        - name: cascache
          image: ko://github.com/imjasonh/playground/ci-substrate/cmd/cascache # pasta:ignore unpinned_container_image
          env:
            - name: ADDR
              value: ":9092"
            - name: METRICS_ADDR
              value: ":9090"
            - name: STORE_DIR
              value: /var/lib/ci-substrate-cache
            - name: ORIGIN_ADDR
              value: cas.ci-substrate.svc.cluster.local:8980
            - name: TENANTS
              valueFrom:
                secretKeyRef: {name: tenants, key: TENANTS}
          ports:
            - {name: grpc, containerPort: 9092}
            - {name: metrics, containerPort: 9090}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            grpc: {port: 9092}
          volumeMounts:
            - {name: cache, mountPath: /var/lib/ci-substrate-cache}
      volumes:
        # emptyDir keeps the warm set for the life of the node-local pod and is
        # writable by the non-root static user. The cache does not evict, so
        # the kubelet evicts the pod (and with it the warm set) when the cache
        # passes sizeLimit. A production install would mount node-local NVMe
        # and evict to a byte budget.
        - name: cache
          emptyDir: {sizeLimit: 10Gi}
---
# internalTrafficPolicy: Local routes each client to the cascache pod on its
# own node, which is what makes the cache node-local without host networking.
apiVersion: v1
kind: Service
metadata:
  name: cascache
  namespace: ci-substrate
spec:
  selector: {app: cascache}
  internalTrafficPolicy: Local
  ports:
    - {name: grpc, port: 9092, targetPort: 9092}
    - {name: metrics, port: 9090, targetPort: 9090}
