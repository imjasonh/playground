# ActorTemplate (protojson-shaped ateapi.ActorTemplate) for a CI build actor
# in the tenant-a atespace. The actor runs the ci-substrate runner against the
# cascache and cas Services. Create one template per tenant atespace:
#
#   ko resolve -f runner-template.yaml > /tmp/runner-template.yaml
#   kubectl ate create actor-template -f /tmp/runner-template.yaml
#
# The tenant token is not in the template. The runner sends a placeholder
# x-ci-substrate-tenant header, and the egress gateway replaces it with the
# tenant's token from a Kubernetes Secret (see egress-cascache.yaml), so no
# credential is inside the sandbox.
metadata:
  atespace: tenant-a
  name: ci-runner
workerSelector:
  matchLabels:
    workload: ci-runner
containers:
- name: runner
  image: ko://github.com/imjasonh/playground/ci-substrate/cmd/runner # pasta:ignore unpinned_container_image
  args:
  - -cache-addr=cascache.ci-substrate.svc.cluster.local:9092
  - -origin-addr=cas.ci-substrate.svc.cluster.local:8980
  - -instance=tenant-a
  - -token=placeholder
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 2147483648 # 2Gi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
