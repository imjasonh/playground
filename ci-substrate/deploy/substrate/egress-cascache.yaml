# EgressPolicy for a tenant-a CI actor. It allows plain gRPC (HTTP/2) to the
# cascache and cas Services on their ports and nothing else. Create it per
# actor, before the actor resumes:
#
#   kubectl ate create egress-policy <actor> -a tenant-a -f egress-cascache.yaml
#
# The gateway replaces the actor's placeholder x-ci-substrate-tenant header
# with tenant-a's token from the Secret ci-substrate-tenant-a/tenant-token (key
# "token"), so the actor never holds the token. Each tenant's token lives in
# its own namespace, and the credential provider's namespace policy grants the
# tenant-a atespace only ci-substrate-tenant-a, so one tenant's policy cannot
# resolve another tenant's token. These rules are plain HTTP:
# the token crosses the gateway-to-Service hop unencrypted, so a real install
# needs mTLS or a mesh on that hop.
rules:
- http:
    hostnames: ["cascache.ci-substrate.svc.cluster.local"]
    ports:
      numbers: [9092]
    effects:
      replaceHeaders:
      - header: x-ci-substrate-tenant
        credentialUri: ate-secret://k8s.io/default/ci-substrate-tenant-a/tenant-token/token
- http:
    hostnames: ["cas.ci-substrate.svc.cluster.local"]
    ports:
      numbers: [8980]
    effects:
      replaceHeaders:
      - header: x-ci-substrate-tenant
        credentialUri: ate-secret://k8s.io/default/ci-substrate-tenant-a/tenant-token/token
