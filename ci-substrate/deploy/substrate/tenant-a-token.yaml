# tenant-a's cas token, in a namespace of its own, for the egress gateway to
# inject (see egress-cascache.yaml). The value must match the tok-a entry in
# ../00-namespace-and-config.yaml. Grant the tenant-a atespace this namespace,
# and only this one, in the k8s-credential-provider-namespace-policy ConfigMap.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-substrate-tenant-a
---
apiVersion: v1
kind: Secret
metadata:
  name: tenant-token
  namespace: ci-substrate-tenant-a
type: Opaque
stringData:
  token: tok-a
