# The actor pool for tenant-a. It runs in the ci-substrate namespace as its
# own ServiceAccount (ci-substrate-pool-tenant-a), which needs the editor role
# in only the tenant-a atespace (see README.md). The pod gets a projected
# ServiceAccount token for Substrate's API audience and the servicedns trust
# bundle that signs the API's certificate, and reaches ate-api-server through
# the ci-substrate namespace's ate.dev/api-access=true label. It reads
# tenant-a's queue from cas with tenant-a's token, and creates, resumes,
# suspends, and deletes actors in the tenant-a atespace from the ci-runner
# template, giving each actor the egress policy in egress-cas.yaml before it
# first resumes. The ConfigMap holds that file:
#
#   kubectl -n ci-substrate create configmap ci-substrate-pool-tenant-a \
#     --from-file=egress-policy.yaml=egress-cas.yaml
#   ko apply -f pool.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-substrate-pool-tenant-a
  namespace: ci-substrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-substrate-pool-tenant-a
  namespace: ci-substrate
type: Opaque
stringData:
  token: tok-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-substrate-pool-tenant-a
  namespace: ci-substrate
  labels:
    app: ci-substrate-pool
    tenant: tenant-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ci-substrate-pool
      tenant: tenant-a
  template:
    metadata:
      labels:
        app: ci-substrate-pool
        tenant: tenant-a
    spec:
      serviceAccountName: ci-substrate-pool-tenant-a
      automountServiceAccountToken: false
      nodeSelector:
        ci-substrate.imjasonh.com/always-on: "true"
      tolerations:
        - key: ci-substrate.imjasonh.com/always-on
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pool
          image: ko://github.com/imjasonh/playground/ci-substrate/cmd/pool # pasta:ignore unpinned_container_image
          envFrom:
            # Collector settings; see ../05-telemetry.yaml.
            - configMapRef: {name: otel, optional: true}
          env:
            - name: ATESPACE
              value: tenant-a
            - name: TEMPLATE
              value: ci-runner
            - name: ENV_TEMPLATE
              value: ci-runner-env
            - name: PREFIX
              value: ci-runner-
            - name: EGRESS_POLICY_FILE
              value: /etc/ci-substrate/egress-policy.yaml
            - name: CAS_ADDR
              value: cas.ci-substrate.svc.cluster.local:8980
            - name: INSTANCES
              value: tenant-a
            - name: WARM
              value: "1"
            - name: MAX
              value: "4"
            - name: IDLE_AFTER
              value: 2m
            - name: WORKER_POOL
              value: ci-substrate-workers/ci-runner
            # Match workerpool.yaml's limits and runner-template.yaml's
            # resources: ci-runner-base's one 2-CPU worker, like each burst
            # worker, holds two 1-CPU actors.
            - name: BASE_SLOTS
              value: "2"
            - name: ACTORS_PER_WORKER
              value: "2"
            - name: MAX_WORKERS
              value: "4"
            - name: TENANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-substrate-pool-tenant-a
                  key: token
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=ci-substrate,ci_substrate.atespace=tenant-a
          volumeMounts:
            - name: ate
              mountPath: /run/ate
              readOnly: true
            - name: config
              mountPath: /etc/ci-substrate
              readOnly: true
            - name: kube-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: ci-substrate-pool-tenant-a
        - name: ate
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-substrate-pool
  namespace: ci-substrate-workers
rules:
  - apiGroups: ["ate.dev"]
    resources: ["workerpools/scale"]
    resourceNames: ["ci-runner"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-substrate-pool
  namespace: ci-substrate-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-substrate-pool
subjects:
  - kind: ServiceAccount
    name: ci-substrate-pool-tenant-a
    namespace: ci-substrate
