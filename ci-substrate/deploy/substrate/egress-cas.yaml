# EgressPolicy for a CI runner actor. It allows plain gRPC (HTTP/2) to the
# cas Service on its port, for leases, the two small protos an action names,
# output uploads, and the result, and to the OpenTelemetry collector, for the
# runner's traces and metrics, and nothing else. Inputs don't go this way;
# they come from the node through the casfs inputs volume. Create it per
# actor, before the actor resumes:
#
#   kubectl ate create egress-policy <actor> -a tenant-a -f egress-cas.yaml
#
# The gateway replaces the actor's placeholder x-ci-substrate-tenant header
# with a short-lived Substrate Actor JWT minted by ateapi for that specific
# actor (atespace + actorName + actorUID). cas verifies the JWT against
# ate-idp-server's OIDC discovery endpoint and enforces that bot_id matches
# actorName, so no per-tenant static token Secret or k8s-credential-provider
# namespace grant is needed, and the actor never holds a reusable secret.
rules:
- http:
    hostnames: ["cas.ci-substrate.svc.cluster.local"]
    ports:
      numbers: [8980]
    effects:
      replaceHeaders:
      - header: x-ci-substrate-tenant
        actorJwt:
          audiences: ["cas.ci-substrate.svc.cluster.local"]
          expirationSeconds: 600
- http:
    hostnames: ["otel-collector.ci-substrate.svc.cluster.local"]
    ports:
      numbers: [4317]
