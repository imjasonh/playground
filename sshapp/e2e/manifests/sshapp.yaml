apiVersion: v1
kind: Namespace
metadata:
  name: sshapps
  labels:
    app.kubernetes.io/part-of: sshapp-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssh-mux
  namespace: sshapps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ssh-mux
  namespace: sshapps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ssh-mux
  namespace: sshapps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ssh-mux
subjects:
  - kind: ServiceAccount
    name: ssh-mux
    namespace: sshapps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: sshapps
  labels:
    app.kubernetes.io/name: hello
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh
          image: HELLO_IMAGE
          imagePullPolicy: Never
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: SSHAPP_ADDR
              value: ":2222"
            - name: SSHAPP_HOST_KEY_PATH
              value: /var/run/ssh/host_ed25519
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ssh-host-key
              mountPath: /var/run/ssh
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 1
            periodSeconds: 2
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ssh-host-key
          secret:
            secretName: hello-ssh-host-key
            items:
              - key: host_ed25519
                path: host_ed25519
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: sshapps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-mux
  namespace: sshapps
  labels:
    app.kubernetes.io/name: ssh-mux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssh-mux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssh-mux
    spec:
      serviceAccountName: ssh-mux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mux
          image: MUX_IMAGE
          imagePullPolicy: Never
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: SSHAPP_LISTEN
              value: ":2222"
            - name: SSHAPP_NAMESPACE
              value: sshapps
            - name: SSHAPP_APP_CONFIG
              value: '{"hello":{"replicas":1,"scale_to_zero":true}}'
            - name: SSHAPP_IDLE_AFTER
              value: 15s
            - name: SSHAPP_WARM_TIMEOUT
              value: 2m
            - name: SSHAPP_HOST_KEY_PATH
              value: /var/run/ssh/host_ed25519
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ssh-host-key
              mountPath: /var/run/ssh
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 1
            periodSeconds: 2
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ssh-host-key
          secret:
            secretName: mux-ssh-host-key
            items:
              - key: host_ed25519
                path: host_ed25519
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-mux
  namespace: sshapps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssh-mux
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
