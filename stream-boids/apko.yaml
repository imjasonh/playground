# Base image for stream-boids: ffmpeg 9 and CA certificates, nothing else.
# ko adds the Go binary on top. terraform/main.tf builds this with the
# apko provider; to build it locally, run:
#   apko build apko.yaml stream-boids-base:latest base.tar
contents:
  repositories:
    - https://apk.cgr.dev/chainguard
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - ffmpeg

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
